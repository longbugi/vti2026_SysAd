document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt:700 19px 'Space Grotesk';\">Gán IP tĩnh bằng netplan<\u002Fh3>\n        <span style=\"margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font:600 11px 'JetBrains Mono';background:rgba(95,99,115,.1);color:#5b6573;\">cả 3 máy<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:8px 0 0;color:#5b6573;font-size:14px;line-height:1.55;\">Mở file netplan và khai báo IP. Ví dụ dưới cho <b style=\"color:#0b7a52;\">waf-server (.10)<\u002Fb> — với web-server đổi thành <code style=\"font-family:'JetBrains Mono';font-size:12.5px;background:#eef1f5;padding:1px 5px;border-radius:4px;\">.20<\u002Fcode>, attacker thành <code style=\"font-family:'JetBrains Mono';font-size:12.5px;background:#eef1f5;padding:1px 5px;border-radius:4px;\">.30<\u002Fcode>.<\u002Fp>\n\n      <div data-term=\"\" style=\"border-radius:12px;overflow:hidden;background:#0d1117;border:1px solid #1f2630;box-shadow:0 12px 28px -16px rgba(13,17,23,.5);margin:14px 0;\">\n        <div style=\"display:flex;align-items:center;gap:11px;padding:10px 14px;background:#161b22;border-bottom:1px solid #21262d;\">\n          <div style=\"display:flex;gap:6px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#ff5f56;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#ffbd2e;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#27c93f;\"><\u002Fspan><\u002Fdiv>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 11px 'JetBrains Mono';background:rgba(15,157,107,.16);color:#5fe3ab;border:1px solid rgba(15,157,107,.35);\">waf-server<\u002Fspan>\n          <span style=\"margin-left:auto;font:600 11px 'JetBrains Mono';color:#6e7681;\">/etc/netplan/01-lab.yaml<\u002Fspan>\n          <button onclick=\"{{ copy }}\" style=\"appearance:none;border:1px solid #30363d;background:#21262d;color:#9fb0c0;font:600 11px 'JetBrains Mono';padding:4px 10px;border-radius:6px;cursor:pointer;\">Copy<\u002Fbutton>\n        <\u002Fdiv>\n        <pre class=\"lab-pre\" style=\"margin:0;padding:16px 18px;overflow-x:auto;font:13px/1.7 'JetBrains Mono';color:#c9d1d9;white-space:pre;\">sudo nano /etc/netplan/01-lab.yaml\n\nnetwork:\n  version: 2\n  ethernets:\n    enp0s3:                          # tên card mạng — kiểm tra bằng: ip a\n      dhcp4: no\n      addresses: [192.168.100.10/24]  # web-server: .20 | attacker: .30\n      routes:\n        - to: default\n          via: 192.168.100.1\n      nameservers:\n        addresses: [8.8.8.8, 1.1.1.1]\n\nsudo netplan apply\nip a                                 # xác nhận đã nhận IP 192.168.100.10<\u002Fpre>\n      <\u002Fdiv>\n\n      <!-- TASK: ufw -->\n      <div style=\"display:flex;align-items:center;gap:12px;margin:38px 0 8px;padding-bottom:13px;border-bottom:2px solid #eef1f5;\">\n        <span style=\"padding:4px 11px;border-radius:8px;background:#0d1117;color:#5fe3ab;font:700 11px 'JetBrains Mono';letter-spacing:.05em;\">BƯỚC 2.2<\u002Fspan>\n        <h3 style=\"margin:0;font:700 19px 'Space Grotesk';\">Tường lửa ufw — thay cho Security Group<\u002Fh3>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:13px;align-items:flex-start;background:#eef4ff;border:1px solid #c5d8fb;border-radius:12px;padding:15px 18px;margin:16px 0;\">\n        <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2f6fed\" stroke-width=\"2\" style=\"flex-shrink:0;margin-top:1px;\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 16v-4M12 8h.01\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:13.5px;line-height:1.55;color:#274690;\"><b>Cốt lõi của bài lab:<\u002Fb> web-server chỉ được nhận traffic HTTP <b>từ waf-server (.10)<\u002Fb>, không nhận trực tiếp từ attacker. Đây chính là vai trò \"Source = sg-waf\" trong bản AWS, nay làm bằng quy tắc <code style=\"font-family:'JetBrains Mono';background:#dbe7ff;padding:1px 5px;border-radius:4px;\">ufw allow from 192.168.100.10<\u002Fcode>.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <p style=\"margin:18px 0 0;font:600 13.5px 'Space Grotesk';color:#2f6fed;\">▸ Trên web-server (.20)<\u002Fp>\n      <div data-term=\"\" style=\"border-radius:12px;overflow:hidden;background:#0d1117;border:1px solid #1f2630;box-shadow:0 12px 28px -16px rgba(13,17,23,.5);margin:10px 0;\">\n        <div style=\"display:flex;align-items:center;gap:11px;padding:10px 14px;background:#161b22;border-bottom:1px solid #21262d;\">\n          <div style=\"display:flex;gap:6px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#ff5f56;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#ffbd2e;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#27c93f;\"><\u002Fspan><\u002Fdiv>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 11px 'JetBrains Mono';background:rgba(47,111,237,.16);color:#6fa0ff;border:1px solid rgba(47,111,237,.35);\">web-server<\u002Fspan>\n          <span style=\"margin-left:auto;font:600 11px 'JetBrains Mono';color:#6e7681;\">bash<\u002Fspan>\n          <button onclick=\"{{ copy }}\" style=\"appearance:none;border:1px solid #30363d;background:#21262d;color:#9fb0c0;font:600 11px 'JetBrains Mono';padding:4px 10px;border-radius:6px;cursor:pointer;\">Copy<\u002Fbutton>\n        <\u002Fdiv>\n        <pre class=\"lab-pre\" style=\"margin:0;padding:16px 18px;overflow-x:auto;font:13px/1.7 'JetBrains Mono';color:#c9d1d9;white-space:pre;\">sudo apt install ufw -y\nsudo ufw allow 22/tcp                                        # SSH quản trị\nsudo ufw allow from 192.168.100.10 to any port 80 proto tcp  # CHỈ WAF được vào :80\nsudo ufw --force enable\nsudo ufw status numbered<\u002Fpre>\n      <\u002Fdiv>\n\n      <p style=\"margin:18px 0 0;font:600 13.5px 'Space Grotesk';color:#0b7a52;\">▸ Trên waf-server (.10) &amp; attacker (.30)<\u002Fp>\n      <div data-term=\"\" style=\"border-radius:12px;overflow:hidden;background:#0d1117;border:1px solid #1f2630;box-shadow:0 12px 28px -16px rgba(13,17,23,.5);margin:10px 0;\">\n        <div style=\"display:flex;align-items:center;gap:11px;padding:10px 14px;background:#161b22;border-bottom:1px solid #21262d;\">\n          <div style=\"display:flex;gap:6px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#ff5f56;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#ffbd2e;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#27c93f;\"><\u002Fspan><\u002Fdiv>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 11px 'JetBrains Mono';background:rgba(15,157,107,.16);color:#5fe3ab;border:1px solid rgba(15,157,107,.35);\">waf-server<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 11px 'JetBrains Mono';background:rgba(229,72,77,.16);color:#ff8b8f;border:1px solid rgba(229,72,77,.35);\">attacker<\u002Fspan>\n          <span style=\"margin-left:auto;font:600 11px 'JetBrains Mono';color:#6e7681;\">bash<\u002Fspan>\n          <button onclick=\"{{ copy }}\" style=\"appearance:none;border:1px solid #30363d;background:#21262d;color:#9fb0c0;font:600 11px 'JetBrains Mono';padding:4px 10px;border-radius:6px;cursor:pointer;\">Copy<\u002Fbutton>\n        <\u002Fdiv>\n        <pre class=\"lab-pre\" style=\"margin:0;padding:16px 18px;overflow-x:auto;font:13px/1.7 'JetBrains Mono';color:#c9d1d9;white-space:pre;\">sudo apt install ufw -y\nsudo ufw allow 22/tcp        # SSH\nsudo ufw allow 80/tcp        # CHỈ chạy dòng này trên waf-server (mở HTTP ra LAN)\nsudo ufw --force enable      # attacker: bỏ dòng allow 80, chỉ cần SSH<\u002Fpre>\n      <\u002Fdiv>\n\n      <!-- TASK: connectivity check -->\n      <div style=\"display:flex;align-items:center;gap:12px;margin:38px 0 8px;padding-bottom:13px;border-bottom:2px solid #eef1f5;\">\n        <span style=\"padding:4px 11px;border-radius:8px;background:#0d1117;color:#5fe3ab;font:700 11px 'JetBrains Mono';letter-spacing:.05em;\">BƯỚC 2.3<\u002Fspan>\n        <h3 style=\"margin:0;font:700 19px 'Space Grotesk';\">Kiểm tra kết nối &amp; cô lập<\u002Fh3>\n      <\u002Fdiv>\n      <div data-term=\"\" style=\"border-radius:12px;overflow:hidden;background:#0d1117;border:1px solid #1f2630;box-shadow:0 12px 28px -16px rgba(13,17,23,.5);margin:14px 0;\">\n        <div style=\"display:flex;align-items:center;gap:11px;padding:10px 14px;background:#161b22;border-bottom:1px solid #21262d;\">\n          <div style=\"display:flex;gap:6px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#ff5f56;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#ffbd2e;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#27c93f;\"><\u002Fspan><\u002Fdiv>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 11px 'JetBrains Mono';background:rgba(229,72,77,.16);color:#ff8b8f;border:1px solid rgba(229,72,77,.35);\">attacker<\u002Fspan>\n          <span style=\"margin-left:auto;font:600 11px 'JetBrains Mono';color:#6e7681;\">bash<\u002Fspan>\n          <button onclick=\"{{ copy }}\" style=\"appearance:none;border:1px solid #30363d;background:#21262d;color:#9fb0c0;font:600 11px 'JetBrains Mono';padding:4px 10px;border-radius:6px;cursor:pointer;\">Copy<\u002Fbutton>\n        <\u002Fdiv>\n        <pre class=\"lab-pre\" style=\"margin:0;padding:16px 18px;overflow-x:auto;font:13px/1.7 'JetBrains Mono';color:#c9d1d9;white-space:pre;\"># Từ attacker (.30):\nping -c2 192.168.100.10                       # tới WAF  → OK\ncurl -I --max-time 5 http://192.168.100.20/   # tới web trực tiếp → BỊ ufw CHẶN (timeout)\n\n# Từ waf-server (.10):\ncurl -I --max-time 5 http://192.168.100.20/   # tới web → OK (ufw cho phép .10)<\u002Fpre>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-start;gap:11px;margin:12px 0 6px;padding:13px 16px;border-radius:11px;background:#eafaf2;border:1px solid #b6ecd2;\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0b7a52\" stroke-width=\"2.3\" style=\"flex-shrink:0;margin-top:1px;\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:13.5px;line-height:1.55;color:#0b5e40;\"><b>Đúng khi:<\u002Fb> attacker ping được WAF nhưng <b>không curl thẳng<\u002Fb> được web-server — chứng tỏ cô lập đã hoạt động.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ 03 INSTALL ============ -->\n    <section id=\"install\">\n      <div style=\"display:flex;align-items:center;gap:14px;margin:54px 0 22px;\">\n        <span style=\"display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;background:#0d1117;color:#5fe3ab;font:700 17px 'Space Grotesk';\">03<\u002Fspan>\n        <h2 style=\"margin:0;font:700 28px 'Space Grotesk';letter-spacing:-.02em;\">Cài đặt phần mềm<\u002Fh2>\n      <\u002Fdiv>\n\n      <!-- TASK 1 -->\n      <div style=\"display:flex;align-items:center;gap:12px;margin:30px 0 8px;padding-bottom:13px;border-bottom:2px solid #eef1f5;\">\n        <span style=\"padding:4px 11px;border-radius:8px;background:#2f6fed;color:#fff;font:700 11px 'JetBrains Mono';letter-spacing:.05em;\">TASK 1<\u002Fspan>\n        <h3 style=\"margin:0;font:700 19px 'Space Grotesk';\">Web Server + DVWA<\u002Fh3>\n        <span style=\"margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font:600 11px 'JetBrains Mono';background:rgba(47,111,237,.12);color:#2f6fed;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#2f6fed;\"><\u002Fspan>web-server<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:11px;margin:24px 0 4px;\"><s ius:6px;cursor:pointer;\">Copy<\u002Fbutton>\n          <\u002Fdiv>\n          <pre class=\"lab-pre\" style=\"margin:0;padding:14px 15px;overflow-x:auto;font:12px/1.65 'JetBrains Mono';color:#c9d1d9;white-space:pre;\"># Qua WAF → 403 Forbidden\ncurl -v \"http://192.168.100.10/dvwa/\\\n?page=../../../../etc/passwd\"<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 4.4 Nikto -->\n      <div style=\"display:flex;align-items:center;gap:11px;margin:30px 0 14px;\">\n        <h3 style=\"margin:0;font:700 18px 'Space Grotesk';\">4.4 — Quét lỗ hổng với Nikto<\u002Fh3>\n        <span style=\"padding:3px 10px;border-radius:999px;background:#fdf3e3;color:#b9740a;font:600 11px 'JetBrains Mono';\">Scanner<\u002Fspan>\n      <\u002Fdiv>\n      <div data-term=\"\" style=\"border-radius:12px;overflow:hidden;background:#0d1117;border:1px solid #1f2630;box-shadow:0 12px 28px -16px rgba(13,17,23,.5);margin:0 0 12px;\">\n        <div style=\"display:flex;align-items:center;gap:11px;padding:10px 14px;background:#161b22;border-bottom:1px solid #21262d;\">\n          <div style=\"display:flex;gap:6px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#ff5f56;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#ffbd2e;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#27c93f;\"><\u002Fspan><\u002Fdiv>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 11px 'JetBrains Mono';background:rgba(229,72,77,.16);color:#ff8b8f;border:1px solid rgba(229,72,77,.35);\">attacker<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 11px 'JetBrains Mono';background:rgba(15,157,107,.16);color:#5fe3ab;border:1px solid rgba(15,157,107,.35);\">waf-server<\u002Fspan>\n          <span style=\"margin-left:auto;font:600 11px 'JetBrains Mono';color:#6e7681;\">bash<\u002Fspan>\n          <button onclick=\"{{ copy }}\" style=\"appearance:none;border:1px solid #30363d;background:#21262d;color:#9fb0c0;font:600 11px 'JetBrains Mono';padding:4px 10px;border-radius:6px;cursor:pointer;\">Copy<\u002Fbutton>\n        <\u002Fdiv>\n        <pre class=\"lab-pre\" style=\"margin:0;padding:16px 18px;overflow-x:auto;font:13px/1.7 'JetBrains Mono';color:#c9d1d9;white-space:pre;\"># Từ attacker — quét qua WAF:\nnikto -h http://192.168.100.10 -output ~/nikto_report.txt 2&gt;&amp;1 | tee ~/nikto_screen.txt\ncat ~/nikto_screen.txt\n\n# Trên waf-server — đếm số request bị chặn (403):\nsudo grep '403' /var/log/nginx/access.log | wc -l<\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ 05 ANALYSIS ============ -->\n    <section id=\"analysis\">\n      <div style=\"display:flex;align-items:center;gap:14px;margin:54px 0 22px;\">\n        <span style=\"display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;background:#0d1117;color:#5fe3ab;font:700 17px 'Space Grotesk';\">05<\u002Fspan>\n        <h2 style=\"margin:0;font:700 28px 'Space Grotesk';letter-spacing:-.02em;\">Phân tích log &amp; custom rule<\u002Fh2>\n      <\u002Fdiv>\n\n      <!-- 5.1 -->\n      <div style=\"display:flex;align-items:center;gap:12px;margin:8px 0 8px;padding-bottom:13px;border-bottom:2px solid #eef1f5;\">\n        <span style=\"padding:4px 11px;border-radius:8px;background:#0d1117;color:#5fe3ab;font:700 11px 'JetBrains Mono';letter-spacing:.05em;\">TASK 5.1<\u002Fspan>\n        <h3 style=\"margin:0;font:700 19px 'Space Grotesk';\">Xem ModSecurity Audit Log<\u002Fh3>\n        <span style=\"margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font:600 11px 'JetBrains Mono';background:rgba(15,157,107,.12);color:#0b7a52;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#0f9d6b;\"><\u002Fspan>waf-server<\u002Fspan>\n      <\u002Fdiv>\n      <div data-term=\"\" style=\"border-radius:12px;overflow:hidden;background:#0d1117;border:1px solid #1f2630;box-shadow:0 12px 28px -16px rgba(13,17,23,.5);margin:14px 0;\">\n        <div style=\"display:flex;align-items:center;gap:11px;padding:10px 14px;background:#161b22;border-bottom:1px solid #21262d;\">\n          <div style=\"display:flex;gap:6px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#ff5f56;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#ffbd2e;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#27c93f;\"><\u002Fspan><\u002Fdiv>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 11px 'JetBrains Mono';background:rgba(15,157,107,.16);color:#5fe3ab;border:1px solid rgba(15,157,107,.35);\">waf-server<\u002Fspan>\n          <span style=\"margin-left:auto;font:600 11px 'JetBrains Mono';color:#6e7681;\">bash<\u002Fspan>\n          <button onclick=\"{{ copy }}\" style=\"appearance:none;border:1px solid #30363d;background:#21262d;color:#9fb0c0;font:600 11px 'JetBrains Mono';padding:4px 10px;border-radius:6px;cursor:pointer;\">Copy<\u002Fbutton>\n        <\u002Fdiv>\n        <pre class=\"lab-pre\" style=\"margin:0;padding:16px 18px;overflow-x:auto;font:13px/1.7 'JetBrains Mono';color:#c9d1d9;white-space:pre;\"># Theo dõi log realtime:\nsudo tail -f /var/log/modsec_audit.log\n# Lọc các request bị block:\nsudo grep -B2 -A30 '403' /var/log/modsec_audit.log | head -80\n# Nginx access log:\nsudo tail -50 /var/log/nginx/access.log\n# Đếm 403 theo từng IP:\nsudo awk '$9==403 {print $1}' /var/log/nginx/access.log | sort | uniq -c | sort -rn<\u002Fpre>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e3e7ec;border-radius:14px;padding:20px 24px;margin:6px 0 8px;\">\n        <div style=\"font:600 13.5px 'Space Grotesk';color:#11151c;margin-bottom:12px;\">Với mỗi tấn công ở mục 04, tìm entry log và ghi lại:<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;font-size:13.5px;\">\n          <div style=\"display:flex;gap:9px;\"><span style=\"color:#0f9d6b;font-weight:700;\">1.<\u002Fspan>Rule ID đã kích hoạt — dạng <code style=\"font-family:'JetBrains Mono';background:#eef1f5;padding:1px 5px;border-radius:4px;\">id:XXXXXX<\u002Fcode><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;\"><span style=\"color:#0f9d6b;font-weight:700;\">2.<\u002Fspan>Severity: CRITICAL / WARNING / NOTICE<\u002Fdiv>\n          <div style=\"display:flex;gap:9px;\"><span style=\"color:#0f9d6b;font-weight:700;\">3.<\u002Fspan>Message mô tả loại tấn công<\u002Fdiv>\n          <div style=\"display:flex;gap:9px;\"><span style=\"color:#0f9d6b;font-weight:700;\">4.<\u002Fspan>Phần URI của request bị chặn<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 5.2 -->\n      <div style=\"display:flex;align-items:center;gap:12px;margin:38px 0 8px;padding-bottom:13px;border-bottom:2px solid #eef1f5;\">\n        <span style=\"padding:4px 11px;border-radius:8px;background:#0d1117;color:#5fe3ab;font:700 11px 'JetBrains Mono';letter-spacing:.05em;\">TASK 5.2<\u002Fspan>\n        <h3 style=\"margin:0;font:700 19px 'Space Grotesk';\">Viết Custom Rules<\u002Fh3>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:11px;margin:24px 0 4px;\"><span style=\"font:700 12px 'JetBrains Mono';color:#0b7a52;background:#eafaf2;padding:3px 9px;border-radius:7px;\">Rule 1<\u002Fspan><h4 style=\"margin:0;font:600 16px 'Space Grotesk';\">Chặn Nikto Scanner theo User-Agent<\u002Fh4><\u002Fdiv>\n      <div data-term=\"\" style=\"border-radius:12px;overflow:hidden;background:#0d1117;border:1px solid #1f2630;box-shadow:0 12px 28px -16px rgba(13,17,23,.5);margin:12px 0;\">\n        <div style=\"display:flex;align-items:center;gap:11px;padding:10px 14px;background:#161b22;border-bottom:1px solid #21262d;\">\n          <div style=\"display:flex;gap:6px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#ff5f56;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#ffbd2e;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#27c93f;\"><\u002Fspan><\u002Fdiv>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 11px 'JetBrains Mono';background:rgba(15,157,107,.16);color:#5fe3ab;border:1px solid rgba(15,157,107,.35);\">waf-server<\u002Fspan>\n          <span style=\"margin-left:auto;font:600 11px 'JetBrains Mono';color:#6e7681;\">main.conf<\u002Fspan>\n          <button onclick=\"{{ copy }}\" style=\"appearance:none;border:1px solid #30363d;background:#21262d;color:#9fb0c0;font:600 11px 'JetBrains Mono';padding:4px 10px;border-radius:6px;cursor:pointer;\">Copy<\u002Fbutton>\n        <\u002Fdiv>\n        <pre class=\"lab-pre\" style=\"margin:0;padding:16px 18px;overflow-x:auto;font:13px/1.7 'JetBrains Mono';color:#c9d1d9;white-space:pre;\">sudo tee -a /etc/nginx/modsec/main.conf &lt;&lt;'EOF'\n# Custom Rule 1: Block Nikto Scanner by User-Agent\nSecRule REQUEST_HEADERS:User-Agent \"@contains nikto\" \\\n    \"id:9001,phase:1,deny,status:403,\\\n     msg:'Custom - Scanner Blocked',\\\n     logdata:'UA: %{REQUEST_HEADERS.User-Agent}'\"\nEOF<\u002Fpre>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:11px;margin:24px 0 4px;\"><span style=\"font:700 12px 'JetBrains Mono';color:#0b7a52;background:#eafaf2;padding:3px 9px;border-radius:7px;\">Rule 2<\u002Fspan><h4 style=\"margin:0;font:600 16px 'Space Grotesk';\">Chặn SQL keywords trong query string<\u002Fh4><\u002Fdiv>\n      <div data-term=\"\" style=\"border-radius:12px;overflow:hidden;background:#0d1117;border:1px solid #1f2630;box-shadow:0 12px 28px -16px rgba(13,17,23,.5);margin:12px 0;\">\n        <div style=\"display:flex;align-items:center;gap:11px;padding:10px 14px;background:#161b22;border-bottom:1px solid #21262d;\">\n          <div style=\"display:flex;gap:6px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#ff5f56;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#ffbd2e;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#27c93f;\"><\u002Fspan><\u002Fdiv>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 11px 'JetBrains Mono';background:rgba(15,157,107,.16);color:#5fe3ab;border:1px solid rgba(15,157,107,.35);\">waf-server<\u002Fspan>\n          <span style=\"margin-left:auto;font:600 11px 'JetBrains Mono';color:#6e7681;\">main.conf<\u002Fspan>\n          <button onclick=\"{{ copy }}\" style=\"appearance:none;border:1px solid #30363d;background:#21262d;color:#9fb0c0;font:600 11px 'JetBrains Mono';padding:4px 10px;border-radius:6px;cursor:pointer;\">Copy<\u002Fbutton>\n        <\u002Fdiv>\n        <pre class=\"lab-pre\" style=\"margin:0;padding:16px 18px;overflow-x:auto;font:13px/1.7 'JetBrains Mono';color:#c9d1d9;white-space:pre;\">sudo tee -a /etc/nginx/modsec/main.conf &lt;&lt;'EOF'\n# Custom Rule 2: Block SQL keywords\nSecRule ARGS \"@rx (?i)(union.*select|drop.*table|insert.*into)\" \\\n    \"id:9002,phase:2,deny,status:403,\\\n     msg:'Custom - SQL Keyword Detected'\"\nEOF<\u002Fpre>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:11px;margin:24px 0 4px;\"><span style=\"font:700 12px 'JetBrains Mono';color:#0b7a52;background:#eafaf2;padding:3px 9px;border-radius:7px;\">Áp dụng<\u002Fspan><h4 style=\"margin:0;font:600 16px 'Space Grotesk';\">Reload &amp; kiểm tra custom rule<\u002Fh4><\u002Fdiv>\n      <div data-term=\"\" style=\"border-radius:12px;overflow:hidden;background:#0d1117;border:1px solid #1f2630;box-shadow:0 12px 28px -16px rgba(13,17,23,.5);margin:12px 0;\">\n        <div style=\"display:flex;align-items:center;gap:11px;padding:10px 14px;background:#161b22;border-bottom:1px solid #21262d;\">\n          <div style=\"display:flex;gap:6px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#ff5f56;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#ffbd2e;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#27c93f;\"><\u002Fspan><\u002Fdiv>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 11px 'JetBrains Mono';background:rgba(15,157,107,.16);color:#5fe3ab;border:1px solid rgba(15,157,107,.35);\">waf-server<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 11px 'JetBrains Mono';background:rgba(229,72,77,.16);color:#ff8b8f;border:1px solid rgba(229,72,77,.35);\">attacker<\u002Fspan>\n          <span style=\"margin-left:auto;font:600 11px 'JetBrains Mono';color:#6e7681;\">bash<\u002Fspan>\n          <button onclick=\"{{ copy }}\" style=\"appearance:none;border:1px solid #30363d;background:#21262d;color:#9fb0c0;font:600 11px 'JetBrains Mono';padding:4px 10px;border-radius:6px;cursor:pointer;\">Copy<\u002Fbutton>\n        <\u002Fdiv>\n        <pre class=\"lab-pre\" style=\"margin:0;padding:16px 18px;overflow-x:auto;font:13px/1.7 'JetBrains Mono';color:#c9d1d9;white-space:pre;\">sudo nginx -t &amp;&amp; sudo systemctl reload nginx\n\n# Test Rule 1 (từ attacker) → 403 Forbidden:\ncurl -A 'Nikto/2.1.6' http://192.168.100.10/\n\n# Test Rule 2 (từ attacker) → 403 Forbidden:\ncurl \"http://192.168.100.10/?q=UNION+SELECT+1,2,3\"\n\n# Xem log custom rule:\nsudo grep 'Custom' /var/log/modsec_audit.log | tail -20<\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ 06 CLEANUP ============ -->\n    <section id=\"cleanup\">\n      <div style=\"display:flex;align-items:center;gap:14px;margin:54px 0 18px;\">\n        <span style=\"display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;background:#0d1117;color:#5fe3ab;font:700 17px 'Space Grotesk';\">06<\u002Fspan>\n        <h2 style=\"margin:0;font:700 28px 'Space Grotesk';letter-spacing:-.02em;\">Dọn dẹp môi trường<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 20px;font-size:15px;line-height:1.65;color:#3b434f;max-width:640px;\">Chạy local nên không phát sinh chi phí, nhưng nên giải phóng tài nguyên máy host và <b>lưu lại bằng chứng<\u002Fb> trước khi xoá.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;\">\n        <div style=\"background:#fff;border:1px solid #e3e7ec;border-radius:14px;padding:20px 22px;\">\n          <div style=\"display:inline-flex;align-items:center;gap:8px;font:700 13px 'Space Grotesk';color:#0b7a52;margin-bottom:10px;\"><span style=\"width:24px;height:24px;border-radius:7px;background:#eafaf2;display:flex;align-items:center;justify-content:center;font:700 12px 'JetBrains Mono';\">A<\u002Fspan>Tạm ngừng — Snapshot &amp; tắt<\u002Fdiv>\n          <p style=\"margin:0 0 10px;font-size:13.5px;color:#5b6573;line-height:1.55;\">Chụp snapshot để giữ nguyên trạng thái rồi tắt máy, dùng lại sau.<\u002Fp>\n          <div data-term=\"\" style=\"border-radius:9px;overflow:hidden;background:#0d1117;border:1px solid #1f2630;\">\n            <div style=\"display:flex;align-items:center;padding:7px 11px;background:#161b22;border-bottom:1px solid #21262d;\"><span style=\"font:600 10.5px 'JetBrains Mono';color:#6e7681;\">trên từng VM<\u002Fspan><button onclick=\"{{ copy }}\" style=\"margin-left:auto;appearance:none;border:1px solid #30363d;background:#21262d;color:#9fb0c0;font:600 10.5px 'JetBrains Mono';padding:3px 8px;border-radius:6px;cursor:pointer;\">Copy<\u002Fbutton><\u002Fdiv>\n            <pre class=\"lab-pre\" style=\"margin:0;padding:12px 14px;overflow-x:auto;font:12px/1.6 'JetBrains Mono';color:#c9d1d9;white-space:pre;\">sudo poweroff\n# (hoặc trong VirtualBox:\n#  Machine → Take Snapshot,\n#  rồi Save State)<\u002Fpre>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e3e7ec;border-radius:14px;padding:20px 22px;\">\n          <div style=\"display:inline-flex;align-items:center;gap:8px;font:700 13px 'Space Grotesk';color:#c4292e;margin-bottom:10px;\"><span style=\"width:24px;height:24px;border-radius:7px;background:#fdecec;display:flex;align-items:center;justify-content:center;font:700 12px 'JetBrains Mono';\">B<\u002Fspan>Kết thúc — Xoá máy ảo<\u002Fdiv>\n          <p style=\"margin:0 0 10px;font-size:13.5px;color:#5b6573;line-height:1.55;\">Khi không cần nữa: tắt rồi Remove/Delete cả 3 VM trong trình quản lý ảo hoá để giải phóng ổ đĩa.<\u002Fp>\n          <div style=\"display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:10px;background:#fdecec;border:1px solid #f4c4c4;\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#c4292e\" stroke-width=\"2\" style=\"flex-shrink:0;margin-top:1px;\"><path d=\"M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:12.5px;line-height:1.5;color:#8a2a2a;\">Xoá VM là mất toàn bộ dữ liệu. Hãy chụp screenshot và lưu báo cáo <b>TRƯỚC KHI<\u002Fb> xoá.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ 07 GRADING ============ -->\n    <section id=\"grading\">\n      <div style=\"display:flex;align-items:center;gap:14px;margin:54px 0 22px;\">\n        <span style=\"display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;background:#0d1117;color:#5fe3ab;font:700 17px 'Space Grotesk';\">07<\u002Fspan>\n        <h2 style=\"margin:0;font:700 28px 'Space Grotesk';letter-spacing:-.02em;\">Tiêu chí chấm điểm<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"overflow:hidden;border:1px solid #e3e7ec;border-radius:14px;\">\n        <table style=\"width:100%;border-collapse:collapse;font-size:13.5px;\">\n          <thead><tr style=\"background:#f6f8fa;text-align:left;\">\n            <th style=\"padding:12px 16px;font:600 12px 'Space Grotesk';color:#5b6573;text-transform:uppercase;letter-spacing:.03em;\">Hạng mục<\u002Fth>\n            <th style=\"padding:12px 14px;font:600 12px 'Space Grotesk';color:#5b6573;text-transform:uppercase;width:70px;\">Điểm<\u002Fth>\n            <th style=\"padding:12px 16px;font:600 12px 'Space Grotesk';color:#5b6573;text-transform:uppercase;\">Bằng chứng yêu cầu<\u002Fth>\n          <\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr style=\"border-top:1px solid #eef1f5;\"><td style=\"padding:12px 16px;\">Tạo đủ 3 VM, đúng IP &amp; ufw<\u002Ftd><td style=\"padding:12px 14px;font-weight:700;color:#0b7a52;\">1.5<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\"><code style=\"font-family:'JetBrains Mono';font-size:12px;\">ufw status<\u002Fcode> + <code style=\"font-family:'JetBrains Mono';font-size:12px;\">ip a<\u002Fcode> của 3 máy<\u002Ftd><\u002Ftr>\n            <tr style=\"border-top:1px solid #eef1f5;background:#fbfcfd;\"><td style=\"padding:12px 16px;\">Nginx + ModSecurity chạy trên waf-server<\u002Ftd><td style=\"padding:12px 14px;font-weight:700;color:#0b7a52;\">1.5<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\"><code style=\"font-family:'JetBrains Mono';font-size:12px;\">nginx -V | grep modsecurity<\u002Fcode> + status<\u002Ftd><\u002Ftr>\n            <tr style=\"border-top:1px solid #eef1f5;\"><td style=\"padding:12px 16px;\">Reverse Proxy đúng (curl qua WAF → 302)<\u002Ftd><td style=\"padding:12px 14px;font-weight:700;color:#0b7a52;\">1.5<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\"><code style=\"font-family:'JetBrains Mono';font-size:12px;\">curl -I http://192.168.100.10/dvwa/<\u002Fcode><\u002Ftd><\u002Ftr>\n            <tr style=\"border-top:1px solid #eef1f5;background:#fbfcfd;\"><td style=\"padding:12px 16px;\">WAF chặn SQL Injection (403)<\u002Ftd><td style=\"padding:12px 14px;font-weight:700;color:#0b7a52;\">1.0<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\">Cặp screenshot: bypass vs chặn qua WAF<\u002Ftd><\u002Ftr>\n            <tr style=\"border-top:1px solid #eef1f5;\"><td style=\"padding:12px 16px;\">WAF chặn XSS (403)<\u002Ftd><td style=\"padding:12px 14px;font-weight:700;color:#0b7a52;\">1.0<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\">Cặp screenshot: bypass vs chặn qua WAF<\u002Ftd><\u002Ftr>\n            <tr style=\"border-top:1px solid #eef1f5;background:#fbfcfd;\"><td style=\"padding:12px 16px;\">WAF chặn LFI (403)<\u002Ftd><td style=\"padding:12px 14px;font-weight:700;color:#0b7a52;\">0.5<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\">Cặp screenshot + log entry<\u002Ftd><\u002Ftr>\n            <tr style=\"border-top:1px solid #eef1f5;\"><td style=\"padding:12px 16px;\">Phân tích audit log (Rule ID + Message)<\u002Ftd><td style=\"padding:12px 14px;font-weight:700;color:#0b7a52;\">1.0<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\">Đoạn log + giải thích 3 rule trigger<\u002Ftd><\u002Ftr>\n            <tr style=\"border-top:1px solid #eef1f5;background:#fbfcfd;\"><td style=\"padding:12px 16px;\">Custom rule hoạt động (Nikto bị chặn 403)<\u002Ftd><td style=\"padding:12px 14px;font-weight:700;color:#0b7a52;\">1.0<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\">Nội dung rule + <code style=\"font-family:'JetBrains Mono';font-size:12px;\">curl -A Nikto<\u002Fcode> → 403<\u002Ftd><\u002Ftr>\n            <tr style=\"border-top:1px solid #eef1f5;\"><td style=\"padding:12px 16px;\">Câu hỏi tự đánh giá (5 câu)<\u002Ftd><td style=\"padding:12px 14px;font-weight:700;color:#0b7a52;\">1.0<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\">Trả lời trong báo cáo<\u002Ftd><\u002Ftr>\n            <tr style=\"border-top:2px solid #e3e7ec;background:#0d1117;\"><td style=\"padding:14px 16px;font:700 14px 'Space Grotesk';color:#fff;\">TỔNG CỘNG<\u002Ftd><td style=\"padding:14px 14px;font:700 15px 'Space Grotesk';color:#5fe3ab;\">10.0<\u002Ftd><td style=\"padding:14px 16px;\"><\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ 08 SUBMIT ============ -->\n    <section id=\"submit\">\n      <div style=\"display:flex;align-items:center;gap:14px;margin:54px 0 22px;\">\n        <span style=\"display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;background:#0d1117;color:#5fe3ab;font:700 17px 'Space Grotesk';\">08<\u002Fspan>\n        <h2 style=\"margin:0;font:700 28px 'Space Grotesk';letter-spacing:-.02em;\">Yêu cầu nộp bài<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;\">\n        <div style=\"background:#fff;border:1px solid #e3e7ec;border-radius:14px;padding:20px 22px;\">\n          <h3 style=\"margin:0 0 12px;font:600 15px 'Space Grotesk';\">Định dạng<\u002Fh3>\n          <div style=\"display:flex;gap:9px;font-size:14px;line-height:1.55;margin-bottom:8px;\"><span style=\"color:#0f9d6b;font-weight:700;\">→<\u002Fspan>File PDF/DOCX: <code style=\"font-family:'JetBrains Mono';font-size:12.5px;background:#eef1f5;padding:1px 6px;border-radius:4px;\">WAF_AWS_&lt;HoTen&gt;_&lt;MSSV&gt;.pdf<\u002Fcode><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;font-size:14px;line-height:1.55;\"><span style=\"color:#0f9d6b;font-weight:700;\">→<\u002Fspan>Nộp qua LMS trước deadline<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e3e7ec;border-radius:14px;padding:20px 22px;\">\n          <h3 style=\"margin:0 0 12px;font:600 15px 'Space Grotesk';\">Checklist nội dung<\u002Fh3>\n          <div style=\"font-size:13px;line-height:1.5;color:#3b434f;display:flex;flex-direction:column;gap:6px;\">\n            <div style=\"display:flex;gap:8px;\"><span style=\"color:#2f6fed;\">☐<\u002Fspan>Thông tin SV (họ tên, MSSV, lớp)<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;\"><span style=\"color:#2f6fed;\">☐<\u002Fspan>Screenshot 3 VM + IP + ufw status<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;\"><span style=\"color:#2f6fed;\">☐<\u002Fspan><code style=\"font-family:'JetBrains Mono';font-size:11.5px;\">nginx -V | grep modsecurity<\u002Fcode><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;\"><span style=\"color:#2f6fed;\">☐<\u002Fspan>curl qua WAF → 302<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;\"><span style=\"color:#2f6fed;\">☐<\u002Fspan>3 cặp screenshot SQLi/XSS/LFI<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;\"><span style=\"color:#2f6fed;\">☐<\u002Fspan>Đoạn modsec_audit.log + Rule ID<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;\"><span style=\"color:#2f6fed;\">☐<\u002Fspan>Custom rule + Nikto bị chặn 403<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;\"><span style=\"color:#2f6fed;\">☐<\u002Fspan>Trả lời 5 câu hỏi tự đánh giá<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <h3 style=\"margin:0 0 14px;font:600 16px 'Space Grotesk';\">Câu hỏi tự đánh giá<\u002Fh3>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid #e3e7ec;border-radius:12px;padding:15px 18px;\"><span style=\"flex-shrink:0;width:26px;height:26px;border-radius:8px;background:#0d1117;color:#5fe3ab;display:flex;align-items:center;justify-content:center;font:700 12px 'JetBrains Mono';\">1<\u002Fspan><span style=\"font-size:14.5px;line-height:1.55;\">WAF khác gì với tường lửa ufw / Security Group? Tại sao cần cả hai?<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid #e3e7ec;border-radius:12px;padding:15px 18px;\"><span style=\"flex-shrink:0;width:26px;height:26px;border-radius:8px;background:#0d1117;color:#5fe3ab;display:flex;align-items:center;justify-content:center;font:700 12px 'JetBrains Mono';\">2<\u002Fspan><span style=\"font-size:14.5px;line-height:1.55;\">Trong lab này, tại sao web-server (.20) KHÔNG được mở HTTP ra toàn mạng?<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid #e3e7ec;border-radius:12px;padding:15px 18px;\"><span style=\"flex-shrink:0;width:26px;height:26px;border-radius:8px;background:#0d1117;color:#5fe3ab;display:flex;align-items:center;justify-content:center;font:700 12px 'JetBrains Mono';\">3<\u002Fspan><span style=\"font-size:14.5px;line-height:1.55;\">Nếu waf-server bị DDoS và down, điều gì xảy ra với web-server? Giải pháp?<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid #e3e7ec;border-radius:12px;padding:15px 18px;\"><span style=\"flex-shrink:0;width:26px;height:26px;border-radius:8px;background:#0d1117;color:#5fe3ab;display:flex;align-items:center;justify-content:center;font:700 12px 'JetBrains Mono';\">4<\u002Fspan><span style=\"font-size:14.5px;line-height:1.55;\">OWASP CRS Rule 942100 thuộc nhóm tấn công nào? Tìm trên coreruleset.org.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid #e3e7ec;border-radius:12px;padding:15px 18px;\"><span style=\"flex-shrink:0;width:26px;height:26px;border-radius:8px;background:#0d1117;color:#5fe3ab;display:flex;align-items:center;justify-content:center;font:700 12px 'JetBrains Mono';\">5<\u002Fspan><span style=\"font-size:14.5px;line-height:1.55;\">Trong production nên dùng cloud WAF (AWS WAF) hay tự cài ModSecurity? So sánh ưu/nhược.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ 09 TROUBLESHOOT ============ -->\n    <section id=\"troubleshoot\">\n      <div style=\"display:flex;align-items:center;gap:14px;margin:54px 0 22px;\">\n        <span style=\"display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;background:#0d1117;color:#5fe3ab;font:700 17px 'Space Grotesk';\">09<\u002Fspan>\n        <h2 style=\"margin:0;font:700 28px 'Space Grotesk';letter-spacing:-.02em;\">Xử lý lỗi thường gặp<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"overflow:hidden;border:1px solid #e3e7ec;border-radius:14px;\">\n        <table style=\"width:100%;border-collapse:collapse;font-size:13px;\">\n          <thead><tr style=\"background:#f6f8fa;text-align:left;\">\n            <th style=\"padding:12px 16px;font:600 11.5px 'Space Grotesk';color:#5b6573;text-transform:uppercase;width:26%;\">Triệu chứng<\u002Fth>\n            <th style=\"padding:12px 16px;font:600 11.5px 'Space Grotesk';color:#5b6573;text-transform:uppercase;width:30%;\">Nguyên nhân<\u002Fth>\n            <th style=\"padding:12px 16px;font:600 11.5px 'Space Grotesk';color:#5b6573;text-transform:uppercase;\">Giải pháp<\u002Fth>\n          <\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr style=\"border-top:1px solid #eef1f5;\"><td style=\"padding:12px 16px;font-weight:600;\">SSH timeout<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\">ufw chưa mở 22 / card mạng sai lớp<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\"><code style=\"font-family:'JetBrains Mono';font-size:11.5px;\">sudo ufw allow 22/tcp<\u002Fcode>; kiểm tra VM cùng lớp 192.168.100.0/24<\u002Ftd><\u002Ftr>\n            <tr style=\"border-top:1px solid #eef1f5;background:#fbfcfd;\"><td style=\"padding:12px 16px;font-weight:600;\">curl web-server: Connection refused<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\">apache2 chưa chạy hoặc ufw sai<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\"><code style=\"font-family:'JetBrains Mono';font-size:11.5px;\">sudo systemctl start apache2<\u002Fcode>; cho phép <code style=\"font-family:'JetBrains Mono';font-size:11.5px;\">from 192.168.100.10<\u002Fcode><\u002Ftd><\u002Ftr>\n            <tr style=\"border-top:1px solid #eef1f5;\"><td style=\"padding:12px 16px;font-weight:600;\">502 Bad Gateway trên WAF<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\">proxy_pass sai IP / web-server down<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\">Kiểm tra .20, <code style=\"font-family:'JetBrains Mono';font-size:11.5px;\">ping 192.168.100.20<\u002Fcode> từ waf<\u002Ftd><\u002Ftr>\n            <tr style=\"border-top:1px solid #eef1f5;background:#fbfcfd;\"><td style=\"padding:12px 16px;font-weight:600;\">ModSecurity vẫn trả 200<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\">SecRuleEngine còn DetectionOnly<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\"><code style=\"font-family:'JetBrains Mono';font-size:11.5px;\">grep SecRuleEngine ...<\u002Fcode> phải = <b>On<\u002Fb><\u002Ftd><\u002Ftr>\n            <tr style=\"border-top:1px solid #eef1f5;\"><td style=\"padding:12px 16px;font-weight:600;\">nginx -t báo lỗi modsecurity<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\">Module chưa load<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\"><code style=\"font-family:'JetBrains Mono';font-size:11.5px;\">apt install libnginx-mod-http-modsecurity<\u002Fcode>; xem <code style=\"font-family:'JetBrains Mono';font-size:11.5px;\">/etc/nginx/modules-enabled/<\u002Fcode><\u002Ftd><\u002Ftr>\n            <tr style=\"border-top:1px solid #eef1f5;background:#fbfcfd;\"><td style=\"padding:12px 16px;font-weight:600;\">modsec_audit.log trống<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\">Audit logging chưa bật<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\"><code style=\"font-family:'JetBrains Mono';font-size:11.5px;\">SecAuditEngine On<\u002Fcode> trong modsecurity.conf<\u002Ftd><\u002Ftr>\n            <tr style=\"border-top:1px solid #eef1f5;\"><td style=\"padding:12px 16px;font-weight:600;\">Request hợp lệ bị 403 (false positive)<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\">CRS quá nghiêm ngặt<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\">Giảm <code style=\"font-family:'JetBrains Mono';font-size:11.5px;\">tx.paranoia_level=1<\u002Fcode> trong crs-setup.conf<\u002Ftd><\u002Ftr>\n            <tr style=\"border-top:1px solid #eef1f5;background:#fbfcfd;\"><td style=\"padding:12px 16px;font-weight:600;\">git clone DVWA thất bại<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\">Thiếu git hoặc DNS chưa OK<\u002Ftd><td style=\"padding:12px 16px;color:#5b6573;\"><code style=\"font-family:'JetBrains Mono';font-size:11.5px;\">sudo apt install git<\u002Fcode>; <code style=\"font-family:'JetBrains Mono';font-size:11.5px;\">ping github.com<\u002Fcode><\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div style=\"margin:40px 0 10px;padding:22px 26px;border-radius:16px;background:#0d1117;text-align:center;\">\n        <div style=\"font:700 16px 'Space Grotesk';color:#fff;margin-bottom:4px;\">Hoàn thành bài lab WAF 🛡<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#9fb0c0;\">ModSecurity v3 + Nginx · 3 VM Ubuntu 26.04 · LAN 192.168.100.0/24<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!--END-->\n   <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    // active TOC highlight\n    const links = [...document.querySelectorAll('.toc-link')];\n    const map = {};\n    links.forEach(l => { map[l.getAttribute('data-toc')] = l; });\n    const setActive = (id) => {\n      links.forEach(l => { l.style.color = '#5b6573'; l.style.background = 'transparent'; l.style.fontWeight = '500'; });\n      const a = map[id];\n      if (a) { a.style.color = '#0b7a52'; a.style.background = '#eafaf2'; a.style.fontWeight = '700'; }\n    };\n    const obs = new IntersectionObserver((entries) => {\n      const vis = entries.filter(e => e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);\n      if (vis[0]) setActive(vis[0].target.id);\n    }, { rootMargin: '-8% 0px -75% 0px', threshold: [0,0.2,0.5] });\n    document.querySelectorAll('section[id]').forEach(s => obs.observe(s));\n  }\n  renderVals() {\n    return {\n      copy: (e) => {\n        const btn = e.currentTarget;\n        const term = btn.closest('[data-term]');\n        const pre = term && term.querySelector('pre');\n        if (!pre || !navigator.clipboard) return;\n        navigator.clipboard.writeText(pre.innerText);\n        const prev = btn.textContent;\n        btn.textContent = '✓ Đã copy';\n        setTimeout(() => { btn.textContent = prev; }, 1400);\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
