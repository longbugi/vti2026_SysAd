  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"206d64b2-7cea-4980-a870-a479d50df940\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"be183d8f-c465-4700-9b4e-209cd98a9631\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n*{box-sizing:border-box;}\nhtml{scroll-behavior:smooth;}\nbody{margin:0;background:#EEF4FF;}\n@keyframes pulseGlow{0%,100%{opacity:.45;transform:scale(1);}50%{opacity:.85;transform:scale(1.08);}}\n@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}\n@keyframes scanline{0%{top:6%;}100%{top:90%;}}\n@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}\n@keyframes dash{to{stroke-dashoffset:-24;}}\n::selection{background:#2563C9;color:#fff;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div id=\"waf-module\" style=\"font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#EEF4FF;color:#0E1A3A;min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.6;\">\n\n<!-- ===================== STICKY NAV ===================== -->\n<nav style=\"position:sticky;top:0;z-index:60;background:rgba(255,255,255,0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #DCE6F8;\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:16px;\">\n    <span style=\"font:700 14px 'Be Vietnam Pro';color:#2D6CB6;\">Bài 30 · WAF<\u002Fspan>\n    <div style=\"margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;\">\n      <button data-nav=\"gioi-thieu\" onclick=\"{{ navGioiThieu }}\" style=\"font:600 13px 'Be Vietnam Pro';border:none;cursor:pointer;background:#2563C9;color:#fff;padding:7px 13px;border-radius:999px;transition:.2s;\">WAF là gì<\u002Fbutton>\n      <button data-nav=\"chuc-nang\" onclick=\"{{ navChucNang }}\" style=\"font:600 13px 'Be Vietnam Pro';border:none;cursor:pointer;background:transparent;color:#5B6B8C;padding:7px 13px;border-radius:999px;transition:.2s;\">Chức năng<\u002Fbutton>\n      <button data-nav=\"hoat-dong\" onclick=\"{{ navHoatDong }}\" style=\"font:600 13px 'Be Vietnam Pro';border:none;cursor:pointer;background:transparent;color:#5B6B8C;padding:7px 13px;border-radius:999px;transition:.2s;\">Hoạt động<\u002Fbutton>\n      <button data-nav=\"vi-du\" onclick=\"{{ navViDu }}\" style=\"font:600 13px 'Be Vietnam Pro';border:none;cursor:pointer;background:transparent;color:#5B6B8C;padding:7px 13px;border-radius:999px;transition:.2s;\">Ví dụ<\u002Fbutton>\n      <button data-nav=\"ung-dung\" onclick=\"{{ navUngDung }}\" style=\"font:600 13px 'Be Vietnam Pro';border:none;cursor:pointer;background:transparent;color:#5B6B8C;padding:7px 13px;border-radius:999px;transition:.2s;\">Ứng dụng<\u002Fbutton>\n      <button data-nav=\"giai-phap\" onclick=\"{{ navGiaiPhap }}\" style=\"font:600 13px 'Be Vietnam Pro';border:none;cursor:pointer;background:transparent;color:#5B6B8C;padding:7px 13px;border-radius:999px;transition:.2s;\">Giải pháp<\u002Fbutton>\n      <button data-nav=\"thuc-hanh\" onclick=\"{{ navThucHanh }}\" style=\"font:600 13px 'Be Vietnam Pro';border:none;cursor:pointer;background:transparent;color:#5B6B8C;padding:7px 13px;border-radius:999px;transition:.2s;\">Thực hành<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- ===================== HERO ===================== -->\n<header style=\"position:relative;overflow:hidden;background:radial-gradient(130% 120% at 82% -10%, #2E63C4 0%, #16306E 48%, #0B1638 100%);color:#fff;\">\n  <div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:46px 46px;opacity:.5;\"><\u002Fdiv>\n  <div style=\"position:absolute;width:520px;height:520px;right:-120px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(0,194,240,.45),transparent 65%);filter:blur(20px);\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:84px 24px 92px;display:grid;grid-template-columns:1.25fr .85fr;gap:40px;align-items:center;\">\n    <div>\n      <div style=\"display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:7px 15px;border-radius:999px;font:700 12.5px 'Be Vietnam Pro';letter-spacing:.12em;margin-bottom:24px;\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:#22E0A6;box-shadow:0 0 10px #22E0A6;\"><\u002Fspan>BÀI 30 · AN TOÀN ỨNG DỤNG WEB\n      <\u002Fdiv>\n      <h1 style=\"font:800 clamp(40px,6vw,72px)/1.04 'Be Vietnam Pro';margin:0 0 8px;letter-spacing:-.02em;\">Web Application<br>Firewall <span style=\"background:linear-gradient(100deg,#37C9F0,#7AE6B8);-webkit-background-clip:text;background-clip:text;color:transparent;\">(WAF)<\u002Fspan><\u002Fh1>\n      <p style=\"font:400 19px/1.6 'Be Vietnam Pro';color:#C5D6F2;max-width:520px;margin:14px 0 28px;\">Tấm khiên đứng trước ứng dụng web của bạn — kiểm tra mọi yêu cầu, chặn kẻ tấn công, cho người dùng thật đi qua.<\u002Fp>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n        <span style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);padding:8px 15px;border-radius:10px;font:600 14px 'Be Vietnam Pro';\">🎓 Dành cho người mới bắt đầu<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);padding:8px 15px;border-radius:10px;font:600 14px 'Be Vietnam Pro';\">⏱️ ~15 phút<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(55,201,240,.18);border:1px solid rgba(55,201,240,.4);padding:8px 15px;border-radius:10px;font:600 14px 'Be Vietnam Pro';color:#9DECFF;\">⚡ Có ví dụ tương tác<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;display:flex;justify-content:center;\">\n      <div style=\"position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(55,201,240,.5),transparent 60%);animation:pulseGlow 4s ease-in-out infinite;\"><\u002Fdiv>\n      <img src=\"35587370-3cf3-45d1-8a0e-83c3332de4f8\" alt=\"Bảo mật ứng dụng web\" style=\"position:relative;width:100%;max-width:380px;border-radius:18px;box-shadow:0 30px 60px rgba(0,0,0,.4);animation:floaty 6s ease-in-out infinite;\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ===================== OBJECTIVES STRIP ===================== -->\n<div style=\"max-width:1200px;margin:0 auto;padding:0 24px;\">\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-46px;position:relative;z-index:5;\">\n    <div style=\"background:#fff;border-radius:16px;padding:22px 20px;box-shadow:0 16px 40px rgba(20,48,110,.12);border:1px solid #E7EEFA;\">\n      <div style=\"font:700 12px 'Be Vietnam Pro';color:#2D6CB6;letter-spacing:.08em;margin-bottom:8px;\">MỤC TIÊU 01<\u002Fdiv>\n      <div style=\"font:700 16px 'Be Vietnam Pro';color:#0E1A3A;\">Hiểu WAF là gì &amp; vì sao cần<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border-radius:16px;padding:22px 20px;box-shadow:0 16px 40px rgba(20,48,110,.12);border:1px solid #E7EEFA;\">\n      <div style=\"font:700 12px 'Be Vietnam Pro';color:#0EA5A0;letter-spacing:.08em;margin-bottom:8px;\">MỤC TIÊU 02<\u002Fdiv>\n      <div style=\"font:700 16px 'Be Vietnam Pro';color:#0E1A3A;\">Nắm chức năng &amp; cách hoạt động<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border-radius:16px;padding:22px 20px;box-shadow:0 16px 40px rgba(20,48,110,.12);border:1px solid #E7EEFA;\">\n      <div style=\"font:700 12px 'Be Vietnam Pro';color:#E5484D;letter-spacing:.08em;margin-bottom:8px;\">MỤC TIÊU 03<\u002Fdiv>\n      <div style=\"font:700 16px 'Be Vietnam Pro';color:#0E1A3A;\">Nhận diện các cuộc tấn công thật<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border-radius:16px;padding:22px 20px;box-shadow:0 16px 40px rgba(20,48,110,.12);border:1px solid #E7EEFA;\">\n      <div style=\"font:700 12px 'Be Vietnam Pro';color:#F2960B;letter-spacing:.08em;margin-bottom:8px;\">MỤC TIÊU 04<\u002Fdiv>\n      <div style=\"font:700 16px 'Be Vietnam Pro';color:#0E1A3A;\">Biết các giải pháp WAF &amp; thực hành<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ===================== SECTION 1: WAF LÀ GÌ ===================== -->\n<section id=\"gioi-thieu\" style=\"max-width:1100px;margin:0 auto;padding:88px 24px 56px;scroll-margin-top:72px;\">\n  <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:16px;\">\n    <span style=\"display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#2563C9;color:#fff;font:700 16px 'Space Grotesk';\">01<\u002Fspan>\n    <span style=\"font:700 13px 'Be Vietnam Pro';letter-spacing:.14em;color:#2563C9;\">KHÁI NIỆM<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font:800 clamp(30px,4.4vw,48px)/1.1 'Be Vietnam Pro';margin:0 0 18px;letter-spacing:-.02em;\">WAF là gì?<\u002Fh2>\n  <p style=\"font:400 19px/1.7 'Be Vietnam Pro';color:#3A4A6B;max-width:760px;margin:0 0 36px;\"><b style=\"color:#0E1A3A;\">WAF (Web Application Firewall)<\u002Fb> là một giải pháp bảo mật được đặt <b style=\"color:#2563C9;\">phía trước ứng dụng web<\u002Fb>, chuyên <b>lọc, giám sát và chặn<\u002Fb> những lưu lượng đáng ngờ trước khi chúng chạm tới máy chủ.<\u002Fp>\n\n  <!-- Analogy box -->\n  <div style=\"display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:linear-gradient(110deg,#EAF2FF,#F3F9FF);border:1px solid #D6E6FF;border-radius:20px;padding:26px 30px;margin-bottom:40px;\">\n    <div style=\"font-size:54px;line-height:1;\">🛡️<\u002Fdiv>\n    <div>\n      <div style=\"font:700 16px 'Be Vietnam Pro';color:#2563C9;margin-bottom:5px;\">Ví dụ dễ hiểu<\u002Fdiv>\n      <p style=\"margin:0;font:400 17px/1.6 'Be Vietnam Pro';color:#314062;\">Hãy tưởng tượng WAF như một <b>nhân viên bảo vệ ở cửa toà nhà<\u002Fb>: mỗi người muốn vào đều bị kiểm tra giấy tờ. Khách bình thường được mời vào, còn kẻ mang theo \"vũ khí\" (mã độc) thì bị chặn ngay tại cửa — không bao giờ vào được bên trong.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Architecture diagram -->\n  <div style=\"background:#fff;border:1px solid #E7EEFA;border-radius:20px;padding:36px 30px;box-shadow:0 12px 34px rgba(20,48,110,.07);margin-bottom:40px;\">\n    <div style=\"font:700 14px 'Be Vietnam Pro';letter-spacing:.1em;color:#7C89A8;text-align:center;margin-bottom:28px;\">WAF ĐỨNG Ở ĐÂU TRONG HỆ THỐNG?<\u002Fdiv>\n    <div style=\"display:flex;align-items:stretch;justify-content:center;gap:0;flex-wrap:wrap;\">\n      <!-- users -->\n      <div style=\"flex:1;min-width:150px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 8px;\">\n        <div style=\"width:74px;height:74px;border-radius:18px;background:#EAF2FF;display:flex;align-items:center;justify-content:center;font-size:34px;\">👥<\u002Fdiv>\n        <div style=\"font:700 15px 'Be Vietnam Pro';color:#0E1A3A;text-align:center;\">Người dùng<\u002Fdiv>\n        <div style=\"font:400 13px 'Be Vietnam Pro';color:#8693AE;text-align:center;\">Khách hàng &amp; kẻ tấn công<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"align-self:center;font-size:26px;color:#B7C5E0;padding:0 4px;\">→<\u002Fdiv>\n      <!-- WAF -->\n      <div style=\"flex:1.1;min-width:180px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 12px;background:linear-gradient(160deg,#2563C9,#16306E);border-radius:18px;box-shadow:0 14px 30px rgba(37,99,201,.35);\">\n        <div style=\"width:74px;height:74px;border-radius:18px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:34px;\">🛡️<\u002Fdiv>\n        <div style=\"font:700 15px 'Be Vietnam Pro';color:#fff;text-align:center;\">WAF<\u002Fdiv>\n        <div style=\"font:400 13px 'Be Vietnam Pro';color:#BcD4F5;text-align:center;color:#C5D9F8;\">Kiểm tra từng yêu cầu<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"align-self:center;font-size:26px;color:#B7C5E0;padding:0 4px;\">→<\u002Fdiv>\n      <!-- server -->\n      <div style=\"flex:1;min-width:150px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 8px;\">\n        <div style=\"width:74px;height:74px;border-radius:18px;background:#E7F7F1;display:flex;align-items:center;justify-content:center;font-size:34px;\">🖥️<\u002Fdiv>\n        <div style=\"font:700 15px 'Be Vietnam Pro';color:#0E1A3A;text-align:center;\">Máy chủ web<\u002Fdiv>\n        <div style=\"font:400 13px 'Be Vietnam Pro';color:#8693AE;text-align:center;\">Ứng dụng của bạn<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:24px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;\">\n      <span style=\"display:inline-flex;align-items:center;gap:8px;font:600 14px 'Be Vietnam Pro';color:#0EA56A;background:#E7F7EF;padding:7px 14px;border-radius:999px;\">✓ Yêu cầu hợp lệ → được chuyển tiếp<\u002Fspan>\n      <span style=\"display:inline-flex;align-items:center;gap:8px;font:600 14px 'Be Vietnam Pro';color:#E5484D;background:#FDECEC;padding:7px 14px;border-radius:999px;\">✕ Yêu cầu độc hại → bị chặn (403)<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Layer 7 + threats -->\n  <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;gap:24px;\">\n    <div style=\"background:#0E1A3A;border-radius:20px;padding:28px;color:#fff;\">\n      <div style=\"font:700 13px 'Be Vietnam Pro';letter-spacing:.1em;color:#7FA8E8;margin-bottom:16px;\">TẦNG ỨNG DỤNG (LAYER 7)<\u002Fdiv>\n      <p style=\"font:400 15px/1.6 'Be Vietnam Pro';color:#BFD0EC;margin:0 0 18px;\">WAF làm việc ở <b style=\"color:#fff;\">tầng 7 của mô hình OSI<\u002Fb> — nơi diễn ra giao tiếp HTTP/HTTPS — khác với firewall mạng thường chỉ chặn theo IP/cổng.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:7px;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#2E63C4,#37C9F0);padding:11px 15px;border-radius:10px;font:700 14px 'Be Vietnam Pro';\">L7 · Ứng dụng (HTTP) <span style=\"font-size:12px;background:rgba(255,255,255,.25);padding:2px 9px;border-radius:6px;\">WAF tại đây<\u002Fspan><\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.08);padding:9px 15px;border-radius:10px;font:500 13px 'Be Vietnam Pro';color:#9FB3D6;\">L4 · Giao vận (TCP/UDP)<\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.08);padding:9px 15px;border-radius:10px;font:500 13px 'Be Vietnam Pro';color:#9FB3D6;\">L3 · Mạng (IP) — Firewall thường<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font:700 16px 'Be Vietnam Pro';color:#0E1A3A;margin-bottom:14px;\">WAF bảo vệ khỏi các kiểu tấn công phổ biến:<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n        <div style=\"background:#FDECEC;border:1px solid #F8D4D4;border-radius:14px;padding:15px;\"><div style=\"font:700 15px 'Be Vietnam Pro';color:#C0353A;margin-bottom:3px;\">SQL Injection<\u002Fdiv><div style=\"font:400 13px 'Be Vietnam Pro';color:#8A5A5C;\">Chèn lệnh SQL để đánh cắp dữ liệu.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#FFF3E2;border:1px solid #FBE2BE;border-radius:14px;padding:15px;\"><div style=\"font:700 15px 'Be Vietnam Pro';color:#B5710A;margin-bottom:3px;\">XSS<\u002Fdiv><div style=\"font:400 13px 'Be Vietnam Pro';color:#8C6A35;\">Chèn mã script vào trình duyệt.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#EDEBFB;border:1px solid #DAD5F5;border-radius:14px;padding:15px;\"><div style=\"font:700 15px 'Be Vietnam Pro';color:#5B4BC4;margin-bottom:3px;\">CSRF<\u002Fdiv><div style=\"font:400 13px 'Be Vietnam Pro';color:#6A618F;\">Giả mạo yêu cầu của người dùng.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#E4F6F1;border:1px solid #C7EBE0;border-radius:14px;padding:15px;\"><div style=\"font:700 15px 'Be Vietnam Pro';color:#0B8A6B;margin-bottom:3px;\">File Inclusion<\u002Fdiv><div style=\"font:400 13px 'Be Vietnam Pro';color:#4A7A6C;\">Lừa server nạp file độc hại.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:12px;background:#EAF2FF;border:1px dashed #B9D2F7;border-radius:14px;padding:13px 16px;font:600 14px 'Be Vietnam Pro';color:#2563C9;\">+ Và toàn bộ danh sách <b>OWASP Top 10<\u002Fb> — các lỗ hổng web nguy hiểm nhất.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== SECTION 2: CHỨC NĂNG ===================== -->\n<section id=\"chuc-nang\" style=\"background:#fff;border-top:1px solid #E7EEFA;border-bottom:1px solid #E7EEFA;scroll-margin-top:72px;\">\n<div style=\"max-width:1100px;margin:0 auto;padding:88px 24px;\">\n  <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:16px;\">\n    <span style=\"display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#0EA5A0;color:#fff;font:700 16px 'Space Grotesk';\">02<\u002Fspan>\n    <span style=\"font:700 13px 'Be Vietnam Pro';letter-spacing:.14em;color:#0EA5A0;\">CHỨC NĂNG CHÍNH<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font:800 clamp(30px,4.4vw,48px)/1.1 'Be Vietnam Pro';margin:0 0 36px;letter-spacing:-.02em;\">WAF làm được những gì?<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;\">\n    <div style=\"border:1px solid #E7EEFA;border-radius:18px;padding:26px;background:linear-gradient(180deg,#F7FBFF,#fff);\">\n      <div style=\"width:52px;height:52px;border-radius:14px;background:#EAF2FF;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px;\">🔍<\u002Fdiv>\n      <div style=\"font:800 19px 'Be Vietnam Pro';color:#0E1A3A;margin-bottom:8px;\">Phân tích &amp; lọc lưu lượng web<\u002Fdiv>\n      <p style=\"margin:0;font:400 15px/1.6 'Be Vietnam Pro';color:#52617F;\">Kiểm tra mọi yêu cầu HTTP/HTTPS để phát hiện và chặn hành vi bất thường hoặc độc hại.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E7EEFA;border-radius:18px;padding:26px;background:linear-gradient(180deg,#FFF7F7,#fff);\">\n      <div style=\"width:52px;height:52px;border-radius:14px;background:#FDECEC;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px;\">⚔️<\u002Fdiv>\n      <div style=\"font:800 19px 'Be Vietnam Pro';color:#0E1A3A;margin-bottom:8px;\">Chống các cuộc tấn công<\u002Fdiv>\n      <p style=\"margin:0;font:400 15px/1.6 'Be Vietnam Pro';color:#52617F;\">Ngăn chặn các kỹ thuật tấn công phổ biến vào ứng dụng web như SQL Injection, XSS.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E7EEFA;border-radius:18px;padding:26px;background:linear-gradient(180deg,#FBF9FF,#fff);\">\n      <div style=\"width:52px;height:52px;border-radius:14px;background:#EDEBFB;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px;\">🤖<\u002Fdiv>\n      <div style=\"font:800 19px 'Be Vietnam Pro';color:#0E1A3A;margin-bottom:8px;\">Chặn bot &amp; DDoS ứng dụng<\u002Fdiv>\n      <p style=\"margin:0;font:400 15px/1.6 'Be Vietnam Pro';color:#52617F;\">Bảo vệ trước lưu lượng từ bot hoặc tấn công từ chối dịch vụ (DDoS) ở cấp ứng dụng.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E7EEFA;border-radius:18px;padding:26px;background:linear-gradient(180deg,#F6FCFA,#fff);\">\n      <div style=\"width:52px;height:52px;border-radius:14px;background:#E4F6F1;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px;\">📋<\u002Fdiv>\n      <div style=\"font:800 19px 'Be Vietnam Pro';color:#0E1A3A;margin-bottom:8px;\">Hỗ trợ tuân thủ tiêu chuẩn<\u002Fdiv>\n      <p style=\"margin:0;font:400 15px/1.6 'Be Vietnam Pro';color:#52617F;\">Đáp ứng yêu cầu bảo mật của <b>PCI DSS, HIPAA<\u002Fb> hoặc <b>ISO 27001<\u002Fb>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== SECTION 3: HOẠT ĐỘNG ===================== -->\n<section id=\"hoat-dong\" style=\"max-width:1100px;margin:0 auto;padding:88px 24px 56px;scroll-margin-top:72px;\">\n  <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:16px;\">\n    <span style=\"display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#6D5BD0;color:#fff;font:700 16px 'Space Grotesk';\">03<\u002Fspan>\n    <span style=\"font:700 13px 'Be Vietnam Pro';letter-spacing:.14em;color:#6D5BD0;\">CƠ CHẾ HOẠT ĐỘNG<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font:800 clamp(30px,4.4vw,48px)/1.1 'Be Vietnam Pro';margin:0 0 12px;letter-spacing:-.02em;\">WAF hoạt động như thế nào?<\u002Fh2>\n  <p style=\"font:400 18px/1.7 'Be Vietnam Pro';color:#3A4A6B;max-width:720px;margin:0 0 38px;\">WAF nằm như một <b style=\"color:#6D5BD0;\">lớp trung gian<\u002Fb> giữa người dùng và máy chủ. Mỗi yêu cầu đi qua 4 bước kiểm tra trước khi được cho phép.<\u002Fp>\n\n  <!-- 4 step flow -->\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:34px;\">\n    <div style=\"background:#fff;border:1px solid #E7EEFA;border-radius:16px;padding:22px 18px;position:relative;\">\n      <div style=\"font:700 13px 'Space Grotesk';color:#6D5BD0;background:#EDEBFB;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;\">1<\u002Fdiv>\n      <div style=\"font:700 15px 'Be Vietnam Pro';color:#0E1A3A;margin-bottom:6px;\">Phân tích yêu cầu<\u002Fdiv>\n      <p style=\"margin:0;font:400 13.5px/1.55 'Be Vietnam Pro';color:#5B6B8C;\">Đọc tiêu đề, URL và payload của HTTP/HTTPS để tìm dấu hiệu độc hại.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E7EEFA;border-radius:16px;padding:22px 18px;\">\n      <div style=\"font:700 13px 'Space Grotesk';color:#6D5BD0;background:#EDEBFB;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;\">2<\u002Fdiv>\n      <div style=\"font:700 15px 'Be Vietnam Pro';color:#0E1A3A;margin-bottom:6px;\">So khớp mẫu<\u002Fdiv>\n      <p style=\"margin:0;font:400 13.5px/1.55 'Be Vietnam Pro';color:#5B6B8C;\"><i>Signature-based<\u002Fi> — so với cơ sở dữ liệu các mẫu tấn công đã biết.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E7EEFA;border-radius:16px;padding:22px 18px;\">\n      <div style=\"font:700 13px 'Space Grotesk';color:#6D5BD0;background:#EDEBFB;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;\">3<\u002Fdiv>\n      <div style=\"font:700 15px 'Be Vietnam Pro';color:#0E1A3A;margin-bottom:6px;\">Phát hiện bất thường<\u002Fdiv>\n      <p style=\"margin:0;font:400 13.5px/1.55 'Be Vietnam Pro';color:#5B6B8C;\"><i>Anomaly-based<\u002Fi> — so với baseline hành vi bình thường để bắt cái lạ.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:linear-gradient(160deg,#6D5BD0,#4A3BA8);border-radius:16px;padding:22px 18px;color:#fff;\">\n      <div style=\"font:700 13px 'Space Grotesk';color:#fff;background:rgba(255,255,255,.2);width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;\">4<\u002Fdiv>\n      <div style=\"font:700 15px 'Be Vietnam Pro';margin-bottom:6px;\">Hành động<\u002Fdiv>\n      <p style=\"margin:0;font:400 13.5px/1.55 'Be Vietnam Pro';color:#DAD3F5;\">Chặn yêu cầu độc hại, gửi cảnh báo hoặc cho quản trị viên can thiệp.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- two detection methods compare -->\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;\">\n    <div style=\"background:#F7F6FF;border:1px solid #E2DEF8;border-radius:18px;padding:24px;\">\n      <div style=\"font:700 16px 'Be Vietnam Pro';color:#5B4BC4;margin-bottom:8px;\">🔖 So khớp mẫu (Signature)<\u002Fdiv>\n      <p style=\"margin:0 0 10px;font:400 14.5px/1.6 'Be Vietnam Pro';color:#52617F;\">Giống như nhận diện tội phạm qua <b>ảnh truy nã<\u002Fb>: nếu khớp mẫu đã biết thì chặn ngay.<\u002Fp>\n      <div style=\"font:600 13px 'Be Vietnam Pro';color:#0EA56A;\">✓ Nhanh, chính xác với tấn công đã biết<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#F7F6FF;border:1px solid #E2DEF8;border-radius:18px;padding:24px;\">\n      <div style=\"font:700 16px 'Be Vietnam Pro';color:#5B4BC4;margin-bottom:8px;\">📈 Phát hiện bất thường (Anomaly)<\u002Fdiv>\n      <p style=\"margin:0 0 10px;font:400 14.5px/1.6 'Be Vietnam Pro';color:#52617F;\">Giống như bảo vệ thấy <b>hành vi lạ thường<\u002Fb>: ai đó gửi 1000 yêu cầu/giây thì rất đáng nghi.<\u002Fp>\n      <div style=\"font:600 13px 'Be Vietnam Pro';color:#0EA56A;\">✓ Bắt được cả tấn công mới chưa từng thấy<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== SECTION 4: VÍ DỤ MINH HOẠ ===================== -->\n<section id=\"vi-du\" style=\"background:linear-gradient(180deg,#0E1A3A,#13245A);color:#fff;scroll-margin-top:72px;\">\n<div style=\"max-width:1100px;margin:0 auto;padding:88px 24px;\">\n  <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:16px;\">\n    <span style=\"display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#E5484D;color:#fff;font:700 16px 'Space Grotesk';\">04<\u002Fspan>\n    <span style=\"font:700 13px 'Be Vietnam Pro';letter-spacing:.14em;color:#FF8E91;\">VÍ DỤ MINH HOẠ CỤ THỂ<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font:800 clamp(30px,4.4vw,48px)/1.1 'Be Vietnam Pro';margin:0 0 12px;letter-spacing:-.02em;\">Xem WAF chặn tấn công thật<\u002Fh2>\n  <p style=\"font:400 18px/1.7 'Be Vietnam Pro';color:#AEC1E6;max-width:720px;margin:0 0 30px;\">Cùng nhìn 3 kiểu tấn công thường gặp nhất — và cách WAF nhận ra rồi chặn chúng.<\u002Fp>\n\n  <!-- tabs -->\n  <div style=\"display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;\">\n    <button onclick=\"{{ setSqli }}\" data-extab=\"sqli\" style=\"font:700 14px 'Be Vietnam Pro';cursor:pointer;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;padding:10px 18px;border-radius:11px;transition:.2s;\">💉 SQL Injection<\u002Fbutton>\n    <button onclick=\"{{ setXss }}\" data-extab=\"xss\" style=\"font:700 14px 'Be Vietnam Pro';cursor:pointer;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;padding:10px 18px;border-radius:11px;transition:.2s;\">📜 XSS<\u002Fbutton>\n    <button onclick=\"{{ setDdos }}\" data-extab=\"ddos\" style=\"font:700 14px 'Be Vietnam Pro';cursor:pointer;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;padding:10px 18px;border-radius:11px;transition:.2s;\">🌊 DDoS / Bot<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- SQLI panel -->\n  <sc-if value=\"{{ exIsSqli }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:28px;\">\n    <div style=\"font:700 18px 'Be Vietnam Pro';margin-bottom:6px;\">💉 SQL Injection — đánh lừa cơ sở dữ liệu<\u002Fdiv>\n    <p style=\"font:400 15px/1.6 'Be Vietnam Pro';color:#AEC1E6;margin:0 0 22px;max-width:780px;\">Kẻ tấn công nhập câu lệnh SQL vào ô đăng nhập để vượt qua kiểm tra mật khẩu và lấy hết dữ liệu.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;\">\n      <div style=\"background:#0A1430;border:1px solid #1FA56A;border-radius:14px;overflow:hidden;\">\n        <div style=\"background:rgba(31,165,106,.15);padding:9px 16px;font:700 13px 'Be Vietnam Pro';color:#3BE08F;display:flex;justify-content:space-between;\">Người dùng thật <span>✓ CHO QUA<\u002Fspan><\u002Fdiv>\n        <pre style=\"margin:0;padding:16px;font:500 13.5px/1.7 'JetBrains Mono';color:#CFE0FF;white-space:pre-wrap;word-break:break-word;\">POST /login\nuser = <span style=\"color:#8FE3B6;\">alice<\u002Fspan>\npass = <span style=\"color:#8FE3B6;\">MyPass123<\u002Fspan><\u002Fpre>\n      <\u002Fdiv>\n      <div style=\"background:#1A0A12;border:1px solid #E5484D;border-radius:14px;overflow:hidden;\">\n        <div style=\"background:rgba(229,72,77,.18);padding:9px 16px;font:700 13px 'Be Vietnam Pro';color:#FF8E91;display:flex;justify-content:space-between;\">Kẻ tấn công <span>✕ WAF CHẶN<\u002Fspan><\u002Fdiv>\n        <pre style=\"margin:0;padding:16px;font:500 13.5px/1.7 'JetBrains Mono';color:#CFE0FF;white-space:pre-wrap;word-break:break-word;\">POST /login\nuser = <span style=\"color:#FF9D9F;\">admin' --<\u002Fspan>\npass = <span style=\"color:#FF9D9F;\">' OR '1'='1<\u002Fspan><\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:16px;background:rgba(229,72,77,.12);border-left:3px solid #E5484D;border-radius:8px;padding:13px 18px;font:500 14.5px/1.6 'Be Vietnam Pro';color:#FFC9CB;\"><b>WAF nhận ra:<\u002Fb> ký tự <code style=\"background:rgba(255,255,255,.12);padding:1px 6px;border-radius:5px;\">'<\u002Fcode>, <code style=\"background:rgba(255,255,255,.12);padding:1px 6px;border-radius:5px;\">--<\u002Fcode> và mẫu <code style=\"background:rgba(255,255,255,.12);padding:1px 6px;border-radius:5px;\">OR '1'='1'<\u002Fcode> là cú pháp SQL → trả về lỗi <b>403 Forbidden<\u002Fb>, dữ liệu an toàn.<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- XSS panel -->\n  <sc-if value=\"{{ exIsXss }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:28px;\">\n    <div style=\"font:700 18px 'Be Vietnam Pro';margin-bottom:6px;\">📜 XSS — chèn mã chạy trên trình duyệt nạn nhân<\u002Fdiv>\n    <p style=\"font:400 15px/1.6 'Be Vietnam Pro';color:#AEC1E6;margin:0 0 22px;max-width:780px;\">Kẻ tấn công gửi đoạn <i>script<\u002Fi> qua ô bình luận. Nếu không lọc, script sẽ chạy trên máy người khác và đánh cắp cookie/phiên đăng nhập.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;\">\n      <div style=\"background:#0A1430;border:1px solid #1FA56A;border-radius:14px;overflow:hidden;\">\n        <div style=\"background:rgba(31,165,106,.15);padding:9px 16px;font:700 13px 'Be Vietnam Pro';color:#3BE08F;display:flex;justify-content:space-between;\">Bình luận thật <span>✓ CHO QUA<\u002Fspan><\u002Fdiv>\n        <pre style=\"margin:0;padding:16px;font:500 13.5px/1.7 'JetBrains Mono';color:#CFE0FF;white-space:pre-wrap;word-break:break-word;\">comment =\n<span style=\"color:#8FE3B6;\">Bài viết rất hữu ích!<\u002Fspan><\u002Fpre>\n      <\u002Fdiv>\n      <div style=\"background:#1A0A12;border:1px solid #E5484D;border-radius:14px;overflow:hidden;\">\n        <div style=\"background:rgba(229,72,77,.18);padding:9px 16px;font:700 13px 'Be Vietnam Pro';color:#FF8E91;display:flex;justify-content:space-between;\">Mã độc <span>✕ WAF CHẶN<\u002Fspan><\u002Fdiv>\n        <pre style=\"margin:0;padding:16px;font:500 13.5px/1.7 'JetBrains Mono';color:#CFE0FF;white-space:pre-wrap;word-break:break-word;\">comment =\n<span style=\"color:#FF9D9F;\">&lt;script&gt;steal(cookie)&lt;/script&gt;<\u002Fspan><\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:16px;background:rgba(229,72,77,.12);border-left:3px solid #E5484D;border-radius:8px;padding:13px 18px;font:500 14.5px/1.6 'Be Vietnam Pro';color:#FFC9CB;\"><b>WAF nhận ra:<\u002Fb> thẻ <code style=\"background:rgba(255,255,255,.12);padding:1px 6px;border-radius:5px;\">&lt;script&gt;<\u002Fcode> và các thuộc tính như <code style=\"background:rgba(255,255,255,.12);padding:1px 6px;border-radius:5px;\">onerror=<\u002Fcode> trong dữ liệu nhập → loại bỏ &amp; chặn yêu cầu.<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- DDOS panel -->\n  <sc-if value=\"{{ exIsDdos }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:28px;\">\n    <div style=\"font:700 18px 'Be Vietnam Pro';margin-bottom:6px;\">🌊 DDoS / Bot — làm nghẽn ứng dụng<\u002Fdiv>\n    <p style=\"font:400 15px/1.6 'Be Vietnam Pro';color:#AEC1E6;margin:0 0 22px;max-width:780px;\">Hàng nghìn yêu cầu giả được bắn liên tục từ bot để làm sập website. WAF nhận diện hành vi bất thường và giới hạn tốc độ (rate limiting).<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;\">\n      <div style=\"background:#0A1430;border:1px solid #1FA56A;border-radius:14px;overflow:hidden;\">\n        <div style=\"background:rgba(31,165,106,.15);padding:9px 16px;font:700 13px 'Be Vietnam Pro';color:#3BE08F;display:flex;justify-content:space-between;\">Người dùng thật <span>✓ CHO QUA<\u002Fspan><\u002Fdiv>\n        <pre style=\"margin:0;padding:16px;font:500 13.5px/1.7 'JetBrains Mono';color:#CFE0FF;white-space:pre-wrap;word-break:break-word;\">1 IP → <span style=\"color:#8FE3B6;\">5 yêu cầu / phút<\u002Fspan>\nHành vi: bình thường<\u002Fpre>\n      <\u002Fdiv>\n      <div style=\"background:#1A0A12;border:1px solid #E5484D;border-radius:14px;overflow:hidden;\">\n        <div style=\"background:rgba(229,72,77,.18);padding:9px 16px;font:700 13px 'Be Vietnam Pro';color:#FF8E91;display:flex;justify-content:space-between;\">Bot tấn công <span>✕ WAF CHẶN<\u002Fspan><\u002Fdiv>\n        <pre style=\"margin:0;padding:16px;font:500 13.5px/1.7 'JetBrains Mono';color:#CFE0FF;white-space:pre-wrap;word-break:break-word;\">1 IP → <span style=\"color:#FF9D9F;\">50.000 yêu cầu / phút<\u002Fspan>\nHành vi: bất thường<\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:16px;background:rgba(229,72,77,.12);border-left:3px solid #E5484D;border-radius:8px;padding:13px 18px;font:500 14.5px/1.6 'Be Vietnam Pro';color:#FFC9CB;\"><b>WAF nhận ra:<\u002Fb> một nguồn gửi quá nhiều yêu cầu so với baseline → <b>giới hạn tốc độ<\u002Fb> hoặc thử thách CAPTCHA, giữ website luôn online.<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- INTERACTIVE DEMO -->\n  <div style=\"margin-top:30px;background:linear-gradient(135deg,#173070,#0E1A3A);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:30px;\">\n    <div style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(55,201,240,.18);border:1px solid rgba(55,201,240,.4);color:#9DECFF;font:700 12px 'Be Vietnam Pro';letter-spacing:.08em;padding:6px 13px;border-radius:999px;margin-bottom:16px;\">⚡ THỬ NGAY<\u002Fdiv>\n    <div style=\"font:700 20px 'Be Vietnam Pro';margin-bottom:6px;\">Tự mình kiểm tra: WAF sẽ phản ứng thế nào?<\u002Fdiv>\n    <p style=\"font:400 14.5px 'Be Vietnam Pro';color:#AEC1E6;margin:0 0 18px;\">Hãy nhập thử vào ô bên dưới — gõ tên bình thường, hoặc thử <code style=\"background:rgba(255,255,255,.12);padding:1px 6px;border-radius:5px;\">' OR '1'='1<\u002Fcode> hay <code style=\"background:rgba(255,255,255,.12);padding:1px 6px;border-radius:5px;\">&lt;script&gt;<\u002Fcode> để xem WAF chặn lại.<\u002Fp>\n    <div style=\"display:flex;gap:10px;align-items:center;background:#0A1430;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:6px 6px 6px 16px;max-width:560px;\">\n      <span style=\"font:600 14px 'JetBrains Mono';color:#7FA8E8;\">user&nbsp;=<\u002Fspan>\n      <input value=\"{{ demoVal }}\" onchange=\"{{ onDemo }}\" oninput=\"{{ onDemo }}\" placeholder=\"nhập dữ liệu thử ở đây...\" style=\"flex:1;background:transparent;border:none;outline:none;color:#fff;font:500 15px 'JetBrains Mono';padding:10px 0;\">\n    <\u002Fdiv>\n    <div style=\"margin-top:16px;min-height:64px;\">\n      <sc-if value=\"{{ demoIdle }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font:500 14px 'Be Vietnam Pro';color:#7C8DB0;padding:14px 0;\">⌨️ Đang chờ dữ liệu nhập...<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ demoSafe }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:14px;align-items:flex-start;background:rgba(31,165,106,.14);border:1px solid rgba(31,165,106,.4);border-radius:12px;padding:15px 18px;\">\n          <span style=\"font-size:24px;\">✓<\u002Fspan>\n          <div><div style=\"font:700 16px 'Be Vietnam Pro';color:#3BE08F;\">CHO QUA — Hợp lệ<\u002Fdiv><div style=\"font:400 14px/1.5 'Be Vietnam Pro';color:#BFEBD3;\">{{ demoReason }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ demoBlock }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:14px;align-items:flex-start;background:rgba(229,72,77,.14);border:1px solid rgba(229,72,77,.45);border-radius:12px;padding:15px 18px;animation:blink 1.4s ease-in-out 2;\">\n          <span style=\"font-size:24px;\">🛑<\u002Fspan>\n          <div><div style=\"font:700 16px 'Be Vietnam Pro';color:#FF8E91;\">CHẶN — 403 Forbidden · {{ demoType }}<\u002Fdiv><div style=\"font:400 14px/1.5 'Be Vietnam Pro';color:#FFC9CB;\">{{ demoReason }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== SECTION 5: ỨNG DỤNG ===================== -->\n<section id=\"ung-dung\" style=\"max-width:1100px;margin:0 auto;padding:88px 24px 56px;scroll-margin-top:72px;\">\n  <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:16px;\">\n    <span style=\"display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#F2960B;color:#fff;font:700 16px 'Space Grotesk';\">05<\u002Fspan>\n    <span style=\"font:700 13px 'Be Vietnam Pro';letter-spacing:.14em;color:#D9820A;\">ỨNG DỤNG THỰC TẾ<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font:800 clamp(30px,4.4vw,48px)/1.1 'Be Vietnam Pro';margin:0 0 36px;letter-spacing:-.02em;\">WAF được dùng ở đâu?<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;\">\n    <div style=\"display:flex;gap:18px;border:1px solid #F4E2C5;background:linear-gradient(180deg,#FFFAF1,#fff);border-radius:18px;padding:24px;\">\n      <div style=\"font-size:34px;line-height:1.1;\">🛒<\u002Fdiv>\n      <div><div style=\"font:800 18px 'Be Vietnam Pro';color:#0E1A3A;margin-bottom:6px;\">Website thương mại điện tử<\u002Fdiv><p style=\"margin:0;font:400 14.5px/1.6 'Be Vietnam Pro';color:#52617F;\">Ngăn tấn công nhằm vào dữ liệu khách hàng và giao dịch thanh toán.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:18px;border:1px solid #F4E2C5;background:linear-gradient(180deg,#FFFAF1,#fff);border-radius:18px;padding:24px;\">\n      <div style=\"font-size:34px;line-height:1.1;\">🔌<\u002Fdiv>\n      <div><div style=\"font:800 18px 'Be Vietnam Pro';color:#0E1A3A;margin-bottom:6px;\">Bảo vệ API<\u002Fdiv><p style=\"margin:0;font:400 14.5px/1.6 'Be Vietnam Pro';color:#52617F;\">Đảm bảo các API không bị khai thác hoặc sử dụng trái phép.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:18px;border:1px solid #F4E2C5;background:linear-gradient(180deg,#FFFAF1,#fff);border-radius:18px;padding:24px;\">\n      <div style=\"font-size:34px;line-height:1.1;\">🕳️<\u002Fdiv>\n      <div><div style=\"font:800 18px 'Be Vietnam Pro';color:#0E1A3A;margin-bottom:6px;\">Ngăn lỗ hổng zero-day<\u002Fdiv><p style=\"margin:0;font:400 14.5px/1.6 'Be Vietnam Pro';color:#52617F;\">Giảm rủi ro từ các lỗ hổng chưa được công bố hay vá lỗi.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:18px;border:1px solid #F4E2C5;background:linear-gradient(180deg,#FFFAF1,#fff);border-radius:18px;padding:24px;\">\n      <div style=\"font-size:34px;line-height:1.1;\">⚖️<\u002Fdiv>\n      <div><div style=\"font:800 18px 'Be Vietnam Pro';color:#0E1A3A;margin-bottom:6px;\">Tuân thủ tiêu chuẩn bảo mật<\u002Fdiv><p style=\"margin:0;font:400 14.5px/1.6 'Be Vietnam Pro';color:#52617F;\">Giảm vi phạm dữ liệu và các vấn đề pháp lý cho doanh nghiệp.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== SECTION 6: GIẢI PHÁP ===================== -->\n<section id=\"giai-phap\" style=\"background:#fff;border-top:1px solid #E7EEFA;border-bottom:1px solid #E7EEFA;scroll-margin-top:72px;\">\n<div style=\"max-width:1100px;margin:0 auto;padding:88px 24px;\">\n  <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:16px;\">\n    <span style=\"display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#2563C9;color:#fff;font:700 16px 'Space Grotesk';\">06<\u002Fspan>\n    <span style=\"font:700 13px 'Be Vietnam Pro';letter-spacing:.14em;color:#2563C9;\">GIẢI PHÁP PHỔ BIẾN<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font:800 clamp(30px,4.4vw,48px)/1.1 'Be Vietnam Pro';margin:0 0 36px;letter-spacing:-.02em;\">Các WAF được dùng nhiều nhất<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;\">\n    <div style=\"border:1px solid #E7EEFA;border-radius:16px;padding:22px;background:#FAFCFF;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;\"><div style=\"font:800 18px 'Be Vietnam Pro';color:#FF9900;\">AWS WAF<\u002Fdiv><span style=\"font:600 11px 'Be Vietnam Pro';background:#EAF2FF;color:#2563C9;padding:3px 9px;border-radius:6px;\">CLOUD<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:0;font:400 14px/1.6 'Be Vietnam Pro';color:#52617F;\">Tích hợp sẵn trên Amazon Web Services, phù hợp cho hệ thống chạy trên AWS.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E7EEFA;border-radius:16px;padding:22px;background:#FAFCFF;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;\"><div style=\"font:800 18px 'Be Vietnam Pro';color:#F38020;\">Cloudflare WAF<\u002Fdiv><span style=\"font:600 11px 'Be Vietnam Pro';background:#EAF2FF;color:#2563C9;padding:3px 9px;border-radius:6px;\">CLOUD<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:0;font:400 14px/1.6 'Be Vietnam Pro';color:#52617F;\">Bảo vệ toàn diện, chi phí hợp lý, tích hợp sẵn tính năng chống DDoS.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E7EEFA;border-radius:16px;padding:22px;background:#FAFCFF;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;\"><div style=\"font:800 18px 'Be Vietnam Pro';color:#E5484D;\">Imperva WAF<\u002Fdiv><span style=\"font:600 11px 'Be Vietnam Pro';background:#FFF3E2;color:#B5710A;padding:3px 9px;border-radius:6px;\">ENTERPRISE<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:0;font:400 14px/1.6 'Be Vietnam Pro';color:#52617F;\">Tập trung bảo vệ các ứng dụng doanh nghiệp lớn, quy mô cao.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E7EEFA;border-radius:16px;padding:22px;background:#FAFCFF;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;\"><div style=\"font:800 18px 'Be Vietnam Pro';color:#E4002B;\">F5 BIG-IP ASM<\u002Fdiv><span style=\"font:600 11px 'Be Vietnam Pro';background:#FFF3E2;color:#B5710A;padding:3px 9px;border-radius:6px;\">ENTERPRISE<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:0;font:400 14px/1.6 'Be Vietnam Pro';color:#52617F;\">Giải pháp WAF mạnh mẽ, nhiều tính năng cho doanh nghiệp lớn.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E7EEFA;border-radius:16px;padding:22px;background:#FAFCFF;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;\"><div style=\"font:800 18px 'Be Vietnam Pro';color:#0EA56A;\">ModSecurity<\u002Fdiv><span style=\"font:600 11px 'Be Vietnam Pro';background:#E4F6F1;color:#0B8A6B;padding:3px 9px;border-radius:6px;\">MÃ NGUỒN MỞ<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:0;font:400 14px/1.6 'Be Vietnam Pro';color:#52617F;\">Miễn phí, mã nguồn mở, hỗ trợ nhiều nền tảng như Apache &amp; Nginx.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px dashed #C7D6F0;border-radius:16px;padding:22px;background:#F4F8FF;display:flex;flex-direction:column;justify-content:center;\">\n      <div style=\"font:700 14px 'Be Vietnam Pro';color:#2563C9;margin-bottom:6px;\">💡 Mẹo chọn WAF<\u002Fdiv>\n      <p style=\"margin:0;font:400 13.5px/1.55 'Be Vietnam Pro';color:#52617F;\">Chạy trên cloud → chọn WAF của nhà cung cấp. Ngân sách hạn chế → ModSecurity. Doanh nghiệp lớn → Imperva / F5.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== SECTION 7: THỰC HÀNH ===================== -->\n<section id=\"thuc-hanh\" style=\"max-width:1100px;margin:0 auto;padding:88px 24px 56px;scroll-margin-top:72px;\">\n  <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:16px;\">\n    <span style=\"display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#0EA5A0;color:#fff;font:700 16px 'Space Grotesk';\">07<\u002Fspan>\n    <span style=\"font:700 13px 'Be Vietnam Pro';letter-spacing:.14em;color:#0EA5A0;\">THỰC HÀNH<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font:800 clamp(30px,4.4vw,48px)/1.1 'Be Vietnam Pro';margin:0 0 30px;letter-spacing:-.02em;\">Bắt tay vào làm<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;\">\n    <div style=\"background:#0E1A3A;border-radius:18px;overflow:hidden;\">\n      <div style=\"display:flex;align-items:center;gap:8px;padding:13px 18px;background:rgba(255,255,255,.05);\"><span style=\"width:11px;height:11px;border-radius:50%;background:#E5484D;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#F2C94C;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#27C281;\"><\u002Fspan><span style=\"font:600 12px 'Be Vietnam Pro';color:#7FA8E8;margin-left:6px;\">Bước 1 — Cài đặt WAF<\u002Fspan><\u002Fdiv>\n      <pre style=\"margin:0;padding:20px;font:500 13.5px/1.8 'JetBrains Mono';color:#CFE0FF;white-space:pre-wrap;\"><span style=\"color:#7C8DB0;\"># Ví dụ: cài ModSecurity cho Nginx<\u002Fspan>\n$ sudo apt install <span style=\"color:#8FE3B6;\">libmodsecurity3<\u002Fspan>\n$ sudo apt install <span style=\"color:#8FE3B6;\">nginx-module-modsecurity<\u002Fspan>\n<span style=\"color:#7C8DB0;\"># Bật module trong nginx.conf<\u002Fspan>\nmodsecurity <span style=\"color:#9DECFF;\">on<\u002Fspan>;<\u002Fpre>\n    <\u002Fdiv>\n    <div style=\"background:#0E1A3A;border-radius:18px;overflow:hidden;\">\n      <div style=\"display:flex;align-items:center;gap:8px;padding:13px 18px;background:rgba(255,255,255,.05);\"><span style=\"width:11px;height:11px;border-radius:50%;background:#E5484D;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#F2C94C;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#27C281;\"><\u002Fspan><span style=\"font:600 12px 'Be Vietnam Pro';color:#7FA8E8;margin-left:6px;\">Bước 2 — Cấu hình bảo vệ website<\u002Fspan><\u002Fdiv>\n      <pre style=\"margin:0;padding:20px;font:500 13.5px/1.8 'JetBrains Mono';color:#CFE0FF;white-space:pre-wrap;\"><span style=\"color:#7C8DB0;\"># Nạp bộ luật OWASP Core Rule Set<\u002Fspan>\nInclude <span style=\"color:#8FE3B6;\">/etc/modsecurity/crs/*.conf<\u002Fspan>\n<span style=\"color:#7C8DB0;\"># Chuyển sang chế độ chặn thật<\u002Fspan>\nSecRuleEngine <span style=\"color:#9DECFF;\">On<\u002Fspan>\n<span style=\"color:#7C8DB0;\"># Kiểm tra: thử gửi ' OR '1'='1 → bị 403<\u002Fspan><\u002Fpre>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:18px;background:#E4F6F1;border:1px solid #C7EBE0;border-radius:14px;padding:16px 20px;font:500 14.5px/1.6 'Be Vietnam Pro';color:#0B6E55;\">✅ <b>Mục tiêu thực hành:<\u002Fb> cài WAF, bật bộ luật OWASP CRS, rồi tự gửi một yêu cầu tấn công thử để xác nhận WAF trả về <b>403 Forbidden<\u002Fb>.<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== SECTION 8: ÔN TẬP ===================== -->\n<section id=\"on-tap\" style=\"background:#fff;border-top:1px solid #E7EEFA;scroll-margin-top:72px;\">\n<div style=\"max-width:1100px;margin:0 auto;padding:88px 24px;\">\n  <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:16px;\">\n    <span style=\"display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:#6D5BD0;color:#fff;font:700 16px 'Space Grotesk';\">08<\u002Fspan>\n    <span style=\"font:700 13px 'Be Vietnam Pro';letter-spacing:.14em;color:#6D5BD0;\">ÔN TẬP NHANH<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font:800 clamp(30px,4.4vw,48px)/1.1 'Be Vietnam Pro';margin:0 0 14px;letter-spacing:-.02em;\">Kiểm tra hiểu bài<\u002Fh2>\n  <p style=\"font:400 17px 'Be Vietnam Pro';color:#52617F;margin:0 0 28px;\">Thử trả lời trong đầu, rồi bấm để xem đáp án.<\u002Fp>\n\n  <div style=\"display:flex;flex-direction:column;gap:12px;max-width:820px;\">\n    <div style=\"border:1px solid #E7EEFA;border-radius:14px;overflow:hidden;\">\n      <button onclick=\"{{ tq0 }}\" style=\"width:100%;text-align:left;cursor:pointer;border:none;background:#F7FAFF;padding:18px 22px;font:700 16px 'Be Vietnam Pro';color:#0E1A3A;display:flex;justify-content:space-between;align-items:center;\">WAF hoạt động ở tầng nào của OSI? <span style=\"color:#6D5BD0;\">＋<\u002Fspan><\u002Fbutton>\n      <sc-if value=\"{{ q0 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 22px 18px;font:400 15px/1.6 'Be Vietnam Pro';color:#3A4A6B;\">Tầng <b>7 — tầng ứng dụng (HTTP/HTTPS)<\u002Fb>. Đây là điểm khác biệt với firewall mạng vốn chỉ lọc theo IP và cổng ở tầng thấp hơn.<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E7EEFA;border-radius:14px;overflow:hidden;\">\n      <button onclick=\"{{ tq1 }}\" style=\"width:100%;text-align:left;cursor:pointer;border:none;background:#F7FAFF;padding:18px 22px;font:700 16px 'Be Vietnam Pro';color:#0E1A3A;display:flex;justify-content:space-between;align-items:center;\">Hai phương pháp WAF dùng để phát hiện tấn công? <span style=\"color:#6D5BD0;\">＋<\u002Fspan><\u002Fbutton>\n      <sc-if value=\"{{ q1 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 22px 18px;font:400 15px/1.6 'Be Vietnam Pro';color:#3A4A6B;\"><b>So khớp mẫu (Signature-based)<\u002Fb> — đối chiếu với mẫu tấn công đã biết; và <b>Phát hiện bất thường (Anomaly-based)<\u002Fb> — so với baseline hành vi bình thường.<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E7EEFA;border-radius:14px;overflow:hidden;\">\n      <button onclick=\"{{ tq2 }}\" style=\"width:100%;text-align:left;cursor:pointer;border:none;background:#F7FAFF;padding:18px 22px;font:700 16px 'Be Vietnam Pro';color:#0E1A3A;display:flex;justify-content:space-between;align-items:center;\">Chuỗi <code style=\"background:#EDEBFB;padding:2px 7px;border-radius:5px;font-size:14px;\">' OR '1'='1<\u002Fcode> là kiểu tấn công gì? <span style=\"color:#6D5BD0;\">＋<\u002Fspan><\u002Fbutton>\n      <sc-if value=\"{{ q2 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 22px 18px;font:400 15px/1.6 'Be Vietnam Pro';color:#3A4A6B;\"><b>SQL Injection<\u002Fb> — đoạn này luôn đúng (<code style=\"background:#F0F2F8;padding:1px 5px;border-radius:4px;\">1=1<\u002Fcode>) nên giúp kẻ tấn công vượt qua bước kiểm tra mật khẩu. WAF nhận ra cú pháp SQL và chặn lại.<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Key takeaways -->\n  <div style=\"margin-top:40px;background:linear-gradient(135deg,#16306E,#0E1A3A);border-radius:22px;padding:34px;color:#fff;\">\n    <div style=\"font:700 13px 'Be Vietnam Pro';letter-spacing:.12em;color:#7FA8E8;margin-bottom:18px;\">📌 GHI NHỚ 3 Ý CHÍNH<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;\">\n      <div><div style=\"font:800 30px 'Space Grotesk';color:#37C9F0;margin-bottom:6px;\">L7<\u002Fdiv><div style=\"font:400 14.5px/1.55 'Be Vietnam Pro';color:#C5D6F2;\">WAF bảo vệ ở <b style=\"color:#fff;\">tầng ứng dụng<\u002Fb>, lọc từng yêu cầu HTTP.<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font:800 30px 'Space Grotesk';color:#37C9F0;margin-bottom:6px;\">2<\u002Fdiv><div style=\"font:400 14.5px/1.55 'Be Vietnam Pro';color:#C5D6F2;\">Dùng <b style=\"color:#fff;\">so khớp mẫu<\u002Fb> &amp; <b style=\"color:#fff;\">phát hiện bất thường<\u002Fb> để bắt tấn công.<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font:800 30px 'Space Grotesk';color:#37C9F0;margin-bottom:6px;\">403<\u002Fdiv><div style=\"font:400 14.5px/1.55 'Be Vietnam Pro';color:#C5D6F2;\">Yêu cầu độc hại bị <b style=\"color:#fff;\">chặn ngay<\u002Fb>, dữ liệu &amp; người dùng an toàn.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== FOOTER ===================== -->\n<footer style=\"background:#0A1228;color:#fff;\">\n  <div style=\"max-width:1100px;margin:0 auto;padding:46px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;\">\n    <div style=\"font:400 13px/1.5 'Be Vietnam Pro';color:#8FA3C8;\">Bài 30: WAF · Way To Enterprise<br>Biên soạn: Yên Nguyễn · 2026<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:760},&quot;defaultExample&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sqli&quot;,&quot;xss&quot;,&quot;ddos&quot;],&quot;default&quot;:&quot;sqli&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;quizRevealed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { exTab: 'sqli', demo: '', quiz: {} };\n\n  setTab(t) { this.setState({ exTab: t }); this._syncTabs(t); }\n  onDemo(e) { this.setState({ demo: e.target.value }); }\n  toggleQuiz(i) { this.setState(s => ({ quiz: { ...s.quiz, [i]: !s.quiz[i] } })); }\n  goTo(id) {\n    const el = document.getElementById(id);\n    if (el) { const y = el.getBoundingClientRect().top + window.scrollY - 64; window.scrollTo({ top: y, behavior: 'smooth' }); }\n  }\n\n  _syncTabs(active) {\n    const r = document.getElementById('waf-module');\n    if (!r) return;\n    r.querySelectorAll('[data-extab]').forEach(b => {\n      const on = b.getAttribute('data-extab') === active;\n      b.style.background = on ? '#E5484D' : 'rgba(255,255,255,.06)';\n      b.style.borderColor = on ? '#E5484D' : 'rgba(255,255,255,.2)';\n    });\n  }\n\n  componentDidMount() {\n    const r = document.getElementById('waf-module');\n    if (!r) return;\n    const de = this.props.defaultExample;\n    if (de && de !== this.state.exTab) this.setTab(de);\n    if (this.props.quizRevealed) this.setState({ quiz: { 0: true, 1: true, 2: true } });\n    this._syncTabs(de || this.state.exTab);\n    const links = [...r.querySelectorAll('[data-nav]')];\n    const obs = new IntersectionObserver((entries) => {\n      entries.forEach(e => {\n        if (e.isIntersecting) {\n          links.forEach(l => { l.style.background = 'transparent'; l.style.color = '#5B6B8C'; });\n          const a = links.find(l => l.getAttribute('data-nav') === e.target.id);\n          if (a) { a.style.background = '#2563C9'; a.style.color = '#fff'; }\n        }\n      });\n    }, { rootMargin: '-42% 0px -54% 0px' });\n    r.querySelectorAll('section[id]').forEach(s => obs.observe(s));\n    this._obs = obs;\n  }\n  componentWillUnmount() { if (this._obs) this._obs.disconnect(); }\n\n  renderVals() {\n    const v = this.state.demo || '';\n    const t = v.trim();\n    const sqli = /('|--|;|\\bunion\\b|\\bdrop\\b|\\bselect\\b[\\s\\S]*\\bfrom\\b|\\bor\\b\\s+['\"\\d]|=\\s*['\"\\d])/i;\n    const xss = /<\\s*script|onerror\\s*=|onload\\s*=|javascript:|<\\s*img|<\\s*svg|alert\\s*\\(/i;\n    let status = 'idle', type = '', reason = '';\n    if (t.length) {\n      if (sqli.test(v)) { status = 'block'; type = 'SQL Injection'; reason = \"Phát hiện ký tự / từ khoá SQL nguy hiểm (' -- OR union select ...).\"; }\n      else if (xss.test(v)) { status = 'block'; type = 'Cross-Site Scripting (XSS)'; reason = 'Phát hiện mã script có thể chạy trong trình duyệt nạn nhân.'; }\n      else { status = 'safe'; reason = 'Không khớp mẫu tấn công nào — yêu cầu được chuyển tới máy chủ.'; }\n    }\n    const q = this.state.quiz;\n    return {\n      navGioiThieu: () => this.goTo('gioi-thieu'),\n      navChucNang: () => this.goTo('chuc-nang'),\n      navHoatDong: () => this.goTo('hoat-dong'),\n      navViDu: () => this.goTo('vi-du'),\n      navUngDung: () => this.goTo('ung-dung'),\n      navGiaiPhap: () => this.goTo('giai-phap'),\n      navThucHanh: () => this.goTo('thuc-hanh'),\n      setSqli: () => this.setTab('sqli'),\n      setXss: () => this.setTab('xss'),\n      setDdos: () => this.setTab('ddos'),\n      exIsSqli: this.state.exTab === 'sqli',\n      exIsXss: this.state.exTab === 'xss',\n      exIsDdos: this.state.exTab === 'ddos',\n      onDemo: (e) => this.onDemo(e),\n      demoVal: v,\n      demoIdle: status === 'idle',\n      demoSafe: status === 'safe',\n      demoBlock: status === 'block',\n      demoType: type,\n      demoReason: reason,\n      tq0: () => this.toggleQuiz(0),\n      tq1: () => this.toggleQuiz(1),\n      tq2: () => this.toggleQuiz(2),\n      q0: !!q[0], q1: !!q[1], q2: !!q[2],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
