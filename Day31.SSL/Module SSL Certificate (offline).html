document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

h:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(163,113,255,.32),transparent 65%);bottom:-160px;right:-100px;filter:blur(20px);animation:orb 22s ease-in-out infinite reverse;\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(ellipse 80% 60% at 50% 45%,#000,transparent);-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 45%,#000,transparent);\"><\u002Fdiv>\n\n  <div style=\"position:relative;text-align:center;max-width:880px;\">\n    <div style=\"display:inline-flex;align-items:center;gap:10px;padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:13px;letter-spacing:1px;color:#aab2d8;margin-bottom:30px;\">\n      <span style=\"width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399;\"><\u002Fspan>\n      BÀI 31 · BẢO MẬT WEB · DÀNH CHO NGƯỜI MỚI BẮT ĐẦU\n    <\u002Fdiv>\n\n    <div style=\"position:relative;width:120px;height:120px;margin:0 auto 34px;animation:floaty 6s ease-in-out infinite;\">\n      <span style=\"position:absolute;inset:0;border-radius:30px;background:linear-gradient(135deg,var(--accent,#5b8cff),var(--accent2,#a371ff));box-shadow:0 24px 60px rgba(91,140,255,.5);display:flex;align-items:center;justify-content:center;\">\n        <svg width=\"58\" height=\"58\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10.5\" rx=\"2.5\" fill=\"#fff\"><\u002Frect><path d=\"M7.5 10.5V8a4.5 4.5 0 019 0v2.5\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"12\" cy=\"15.4\" r=\"1.7\" fill=\"var(--accent,#5b8cff)\"><\u002Fcircle><rect x=\"11.2\" y=\"15.4\" width=\"1.6\" height=\"3.4\" rx=\".8\" fill=\"var(--accent,#5b8cff)\"><\u002Frect><\u002Fsvg>\n      <\u002Fspan>\n      <span style=\"position:absolute;inset:-12px;border-radius:38px;border:2px solid rgba(91,140,255,.5);animation:pulseRing 3s ease-out infinite;\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <h1 style=\"font-family:'Sora';font-weight:800;font-size:clamp(44px,7vw,82px);line-height:1.02;margin:0 0 18px;letter-spacing:-1.5px;\">\n      Certificate <span style=\"background:linear-gradient(120deg,var(--accent,#5b8cff),var(--accent2,#a371ff));-webkit-background-clip:text;background-clip:text;color:transparent;\">SSL<\u002Fspan>\n    <\u002Fh1>\n    <p style=\"font-size:clamp(17px,2.2vw,21px);color:#aab2d8;line-height:1.6;max-width:620px;margin:0 auto 34px;\">\n      Chiếc ổ khóa nhỏ trên thanh địa chỉ trình duyệt — nó là gì, hoạt động ra sao và vì sao mọi website ngày nay đều cần nó.\n    <\u002Fp>\n\n    <div style=\"display:flex;gap:14px;justify-content:center;flex-wrap:wrap;\">\n      <a href=\"#khai-niem\" style=\"text-decoration:none;padding:14px 28px;border-radius:13px;background:linear-gradient(135deg,var(--accent,#5b8cff),var(--accent2,#a371ff));color:#fff;font-weight:600;font-size:16px;box-shadow:0 12px 30px rgba(91,140,255,.4);\">Bắt đầu học →<\u002Fa>\n      <a href=\"#thuc-hanh\" style=\"text-decoration:none;padding:14px 28px;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#eef1ff;font-weight:600;font-size:16px;\">Phần thực hành<\u002Fa>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:30px;justify-content:center;margin-top:48px;flex-wrap:wrap;color:#7a83ad;font-size:13.5px;\">\n      <span>📘 9 phần học<\u002Fspan>\n      <span style=\"opacity:.4;\">•<\u002Fspan>\n      <span>⏱ ~25 phút đọc<\u002Fspan>\n      <span style=\"opacity:.4;\">•<\u002Fspan>\n      <span>Biên soạn: <b style=\"color:#c7cdf0;\">Yên Nguyễn<\u002Fb><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== MỤC TIÊU ===== -->\n<section id=\"muc-tieu\" data-section=\"\" style=\"padding:90px 24px;background:linear-gradient(180deg,#0a0e1f,#0c1226);\">\n  <div style=\"max-width:1000px;margin:0 auto;\">\n    <div style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Sora';font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(120deg,var(--accent,#5b8cff),var(--accent2,#a371ff));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;\">◆ Mục tiêu bài học<\u002Fdiv>\n    <h2 style=\"font-family:'Sora';font-weight:700;font-size:clamp(28px,4vw,40px);margin:0 0 14px;line-height:1.15;\">Học xong phần này, bạn sẽ…<\u002Fh2>\n    <p style=\"color:#aab2d8;font-size:17px;line-height:1.7;max-width:640px;margin:0 0 40px;\">Sáu điều cốt lõi cần nắm — từ khái niệm tới khi tự tay cài được chứng chỉ cho website của mình.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;\">\n      <sc-for list=\"{{objectives}}\" as=\"obj\" hint-placeholder-count=\"6\">\n        <div style=\"display:flex;gap:16px;align-items:flex-start;padding:24px;border-radius:16px;background:linear-gradient(180deg,#141a36,#10152b);border:1px solid rgba(255,255,255,.07);\">\n          <span style=\"flex:none;width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,rgba(91,140,255,.22),rgba(163,113,255,.22));border:1px solid rgba(124,140,255,.3);display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;color:var(--accent,#7c9bff);\">{{obj.num}}<\u002Fspan>\n          <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:#d4d9f5;padding-top:7px;\">{{obj.text}}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== KHÁI NIỆM ===== -->\n<section id=\"khai-niem\" data-section=\"\" style=\"padding:90px 24px;\">\n  <div style=\"max-width:1000px;margin:0 auto;\">\n    <div style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Sora';font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(120deg,var(--accent,#5b8cff),var(--accent2,#a371ff));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;\">01 · Khái niệm<\u002Fdiv>\n    <h2 style=\"font-family:'Sora';font-weight:700;font-size:clamp(28px,4vw,40px);margin:0 0 18px;line-height:1.15;\">SSL là gì? Giải thích đơn giản<\u002Fh2>\n\n    <div style=\"display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center;margin-top:10px;\">\n      <div>\n        <p style=\"color:#c2c8ec;font-size:18px;line-height:1.75;margin:0 0 18px;\"><b style=\"color:#fff;\">SSL (Secure Sockets Layer)<\u002Fb> là một tiêu chuẩn bảo mật tạo ra một <span style=\"color:var(--accent,#7c9bff);font-weight:600;\">\"đường ống mã hóa\"<\u002Fspan> giữa trình duyệt của bạn và máy chủ website.<\u002Fp>\n        <p style=\"color:#aab2d8;font-size:16px;line-height:1.75;margin:0 0 18px;\">Mọi dữ liệu chạy qua đường ống này (mật khẩu, số thẻ, tin nhắn…) đều được khóa kín, người ngoài có chặn được cũng không đọc nổi.<\u002Fp>\n        <div style=\"display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:14px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25);\">\n          <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"flex:none;margin-top:2px;\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#34d399\"><\u002Fcircle><path d=\"M8 12l3 3 5-6\" stroke=\"#06251a\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <p style=\"margin:0;font-size:15px;line-height:1.6;color:#bfeede;\"><b style=\"color:#eafff7;\">Ví dụ ví von:<\u002Fb> SSL giống như gửi thư trong một <b>phong bì niêm phong<\u002Fb> thay vì viết lên tấm bưu thiếp ai cũng đọc được.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- real example: https green bar -->\n      <div style=\"border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 24px 50px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1);\">\n        <div style=\"display:flex;gap:7px;padding:11px 14px;background:#e9edf4;align-items:center;\">\n          <span style=\"width:11px;height:11px;border-radius:50%;background:#ff5f57;\"><\u002Fspan>\n          <span style=\"width:11px;height:11px;border-radius:50%;background:#febc2e;\"><\u002Fspan>\n          <span style=\"width:11px;height:11px;border-radius:50%;background:#28c840;\"><\u002Fspan>\n        <\u002Fdiv>\n        <img src=\"48479562-1bee-4c71-9097-06bee0422531\" alt=\"Thanh địa chỉ https với ổ khóa bảo mật\" style=\"width:100%;display:block;\">\n        <div style=\"padding:14px 16px;background:#fff;color:#1a2138;font-size:13.5px;line-height:1.5;\">\n          <b style=\"color:#0b7a3b;\">🔒 https://<\u002Fb> + biểu tượng ổ khóa = trang web đang được SSL bảo vệ.\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 3 jargon chips -->\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:34px;\">\n      <div style=\"padding:22px;border-radius:15px;background:linear-gradient(180deg,#141a36,#10152b);border:1px solid rgba(255,255,255,.07);\">\n        <div style=\"font-family:'JetBrains Mono';font-size:13px;color:var(--accent,#7c9bff);margin-bottom:8px;\">SSL / TLS<\u002Fdiv>\n        <p style=\"margin:0;font-size:14.5px;color:#aab2d8;line-height:1.6;\">Giao thức mã hóa. TLS là phiên bản mới hơn của SSL nhưng tên gọi \"SSL\" vẫn được dùng quen.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:22px;border-radius:15px;background:linear-gradient(180deg,#141a36,#10152b);border:1px solid rgba(255,255,255,.07);\">\n        <div style=\"font-family:'JetBrains Mono';font-size:13px;color:var(--accent,#7c9bff);margin-bottom:8px;\">Certificate (Chứng chỉ)<\u002Fdiv>\n        <p style=\"margin:0;font-size:14.5px;color:#aab2d8;line-height:1.6;\">Tệp dữ liệu trên máy chủ — như \"căn cước công dân\" số của website, chứng minh danh tính.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:22px;border-radius:15px;background:linear-gradient(180deg,#141a36,#10152b);border:1px solid rgba(255,255,255,.07);\">\n        <div style=\"font-family:'JetBrains Mono';font-size:13px;color:var(--accent,#7c9bff);margin-bottom:8px;\">CA — Certificate Authority<\u002Fdiv>\n        <p style=\"margin:0;font-size:14.5px;color:#aab2d8;line-height:1.6;\">Tổ chức uy tín đứng ra cấp &amp; bảo chứng cho các chứng chỉ — như \"cơ quan công an\" cấp căn cước.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== MÔ PHỎNG TẤN CÔNG ===== -->\n<section id=\"mo-phong\" data-section=\"\" style=\"padding:90px 24px;background:linear-gradient(180deg,#0c1226,#0a0e1f);\">\n  <div style=\"max-width:1000px;margin:0 auto;\">\n    <div style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Sora';font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(120deg,#fb7185,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;\">⚠ Tình huống · Vì sao cần SSL<\u002Fdiv>\n    <h2 style=\"font-family:'Sora';font-weight:700;font-size:clamp(28px,4vw,40px);margin:0 0 14px;line-height:1.15;\">Kẻ tấn công \"nghe lén\" như thế nào?<\u002Fh2>\n    <p style=\"color:#aab2d8;font-size:17px;line-height:1.7;max-width:680px;margin:0 0 30px;\">Bạn đăng nhập ngân hàng qua WiFi quán cà phê. Dữ liệu đi từ máy bạn → máy chủ. Trên đường đi, một kẻ xấu cùng mạng WiFi cố đọc trộm. Hãy bật/tắt SSL để xem khác biệt:<\u002Fp>\n\n    <!-- toggle -->\n    <div style=\"display:inline-flex;padding:5px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);margin-bottom:28px;gap:5px;\">\n      <button onclick=\"{{setHttp}}\" style=\"{{httpBtn}}\">HTTP — Không có SSL<\u002Fbutton>\n      <button onclick=\"{{setHttps}}\" style=\"{{httpsBtn}}\">HTTPS — Có SSL<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- diagram -->\n    <div style=\"padding:36px 28px;border-radius:20px;background:linear-gradient(180deg,#141a36,#0e1326);border:1px solid {{simBorder}};transition:border-color .3s;\">\n      <div style=\"display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;\">\n        <!-- sender -->\n        <div style=\"text-align:center;\">\n          <div style=\"width:64px;height:64px;margin:0 auto 12px;border-radius:16px;background:rgba(91,140,255,.14);border:1px solid rgba(91,140,255,.3);display:flex;align-items:center;justify-content:center;\">\n            <svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"13\" rx=\"2\" stroke=\"#7c9bff\" stroke-width=\"1.8\"><\u002Frect><path d=\"M8 21h8M12 17v4\" stroke=\"#7c9bff\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-weight:600;font-size:14px;color:#d4d9f5;\">Bạn (trình duyệt)<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#7a83ad;margin-top:3px;\">Gửi đi thông tin<\u002Fdiv>\n        <\u002Fdiv>\n        <!-- arrow + data packet -->\n        <div style=\"position:relative;width:140px;text-align:center;\">\n          <svg width=\"140\" height=\"30\" viewBox=\"0 0 140 30\" style=\"display:block;\"><line x1=\"6\" y1=\"15\" x2=\"120\" y2=\"15\" stroke=\"{{simLine}}\" stroke-width=\"2.5\" stroke-dasharray=\"7 5\" style=\"animation:dash 1s linear infinite;\"><\u002Fline><path d=\"M120 8l12 7-12 7z\" fill=\"{{simLine}}\"><\u002Fpath><\u002Fsvg>\n          <div style=\"margin-top:8px;padding:9px 10px;border-radius:9px;background:{{packetBg}};border:1px solid {{packetBorder}};font-family:'JetBrains Mono';font-size:12px;color:{{packetColor}};word-break:break-all;line-height:1.4;transition:all .3s;\">{{packetText}}<\u002Fdiv>\n        <\u002Fdiv>\n        <!-- server -->\n        <div style=\"text-align:center;\">\n          <div style=\"width:64px;height:64px;margin:0 auto 12px;border-radius:16px;background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.3);display:flex;align-items:center;justify-content:center;\">\n            <svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"4\" y=\"3\" width=\"16\" height=\"7\" rx=\"1.6\" stroke=\"#34d399\" stroke-width=\"1.8\"><\u002Frect><rect x=\"4\" y=\"14\" width=\"16\" height=\"7\" rx=\"1.6\" stroke=\"#34d399\" stroke-width=\"1.8\"><\u002Frect><circle cx=\"8\" cy=\"6.5\" r=\"1\" fill=\"#34d399\"><\u002Fcircle><circle cx=\"8\" cy=\"17.5\" r=\"1\" fill=\"#34d399\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-weight:600;font-size:14px;color:#d4d9f5;\">Máy chủ ngân hàng<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#7a83ad;margin-top:3px;\">Nhận &amp; xử lý<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- attacker -->\n      <div style=\"display:flex;justify-content:center;margin-top:14px;\">\n        <svg width=\"2\" height=\"34\" viewBox=\"0 0 2 34\"><line x1=\"1\" y1=\"0\" x2=\"1\" y2=\"34\" stroke=\"{{simLine}}\" stroke-width=\"2\" stroke-dasharray=\"4 4\"><\u002Fline><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"max-width:520px;margin:0 auto;padding:18px 20px;border-radius:14px;background:{{attackerBg}};border:1px solid {{attackerBorder}};display:flex;gap:16px;align-items:center;transition:all .3s;\">\n        <div style=\"flex:none;width:48px;height:48px;border-radius:12px;background:{{attackerIconBg}};display:flex;align-items:center;justify-content:center;\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M3 11c0-1 2-2 9-2s9 1 9 2-1 4-3 4c-1.5 0-2-1-3-1s-1.2 1-3 1-2-1-3-1-1.5 1-3 1c-2 0-3-3-3-4z\" fill=\"{{attackerIcon}}\"><\u002Fpath><circle cx=\"8.5\" cy=\"11.5\" r=\"1.4\" fill=\"#0a0e1f\"><\u002Fcircle><circle cx=\"15.5\" cy=\"11.5\" r=\"1.4\" fill=\"#0a0e1f\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-weight:700;font-size:14.5px;color:{{attackerTitle}};margin-bottom:3px;\">Kẻ tấn công nghe lén thấy:<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono';font-size:13px;color:{{packetColor}};word-break:break-all;\">{{attackerSees}}<\u002Fdiv>\n          <div style=\"font-size:13px;color:{{attackerNote}};margin-top:6px;\">{{attackerMsg}}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== BÊN TRONG CHỨNG CHỈ ===== -->\n<section id=\"ben-trong\" data-section=\"\" style=\"padding:90px 24px;\">\n  <div style=\"max-width:1000px;margin:0 auto;\">\n    <div style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Sora';font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(120deg,var(--accent,#5b8cff),var(--accent2,#a371ff));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;\">02 · Cấu trúc<\u002Fdiv>\n    <h2 style=\"font-family:'Sora';font-weight:700;font-size:clamp(28px,4vw,40px);margin:0 0 14px;line-height:1.15;\">Bên trong một chứng chỉ SSL có gì?<\u002Fh2>\n    <p style=\"color:#aab2d8;font-size:17px;line-height:1.7;max-width:680px;margin:0 0 34px;\">Chứng chỉ là một tệp công khai chứa thông tin định danh website, cộng với một cặp chìa khóa đặc biệt.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;\">\n      <!-- info list -->\n      <div style=\"padding:26px;border-radius:18px;background:linear-gradient(180deg,#141a36,#10152b);border:1px solid rgba(255,255,255,.07);\">\n        <h3 style=\"font-family:'Sora';font-size:18px;margin:0 0 18px;color:#fff;\">Thông tin công khai lưu trong chứng chỉ<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:11px;\">\n          <sc-for list=\"{{certFields}}\" as=\"f\" hint-placeholder-count=\"7\">\n            <div style=\"display:flex;gap:11px;align-items:center;font-size:14.5px;color:#c2c8ec;\">\n              <span style=\"flex:none;width:7px;height:7px;border-radius:2px;background:linear-gradient(135deg,var(--accent,#5b8cff),var(--accent2,#a371ff));\"><\u002Fspan>{{f}}\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- real cert screenshot -->\n      <div>\n        <div style=\"border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 24px 50px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1);\">\n          <img src=\"490fc492-63bf-4bef-a1b5-02e2d0c5ef2c\" alt=\"Cửa sổ chi tiết chứng chỉ SSL thật\" style=\"width:100%;display:block;\">\n        <\u002Fdiv>\n        <p style=\"font-size:13px;color:#7a83ad;text-align:center;margin:12px 0 0;\">▲ Chứng chỉ <b style=\"color:#9aa3c7;\">EV SSL<\u002Fb> thật của Wells Fargo — bấm ổ khóa trên trình duyệt là xem được.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- public/private key diagram -->\n    <h3 style=\"font-family:'Sora';font-size:21px;margin:46px 0 8px;color:#fff;\">Cặp chìa khóa: Public key &amp; Private key<\u002Fh3>\n    <p style=\"color:#aab2d8;font-size:16px;line-height:1.7;max-width:720px;margin:0 0 28px;\">Đây là trái tim của SSL. Dữ liệu được <b style=\"color:var(--accent,#7c9bff);\">khóa bằng Public key<\u002Fb> chỉ có thể <b style=\"color:#34d399;\">mở bằng Private key<\u002Fb> tương ứng — và ngược lại.<\u002Fp>\n\n    <div style=\"padding:34px 24px;border-radius:20px;background:linear-gradient(180deg,#141a36,#0e1326);border:1px solid rgba(255,255,255,.07);\">\n      <div style=\"display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:14px;align-items:center;text-align:center;\">\n        <!-- sender encrypt -->\n        <div>\n          <div style=\"width:58px;height:58px;margin:0 auto 10px;border-radius:50%;background:rgba(251,113,133,.15);border:1px solid rgba(251,113,133,.4);display:flex;align-items:center;justify-content:center;\">\n            <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\" fill=\"#fb7185\"><\u002Frect><path d=\"M8 11V8a4 4 0 018 0v3\" stroke=\"#fb7185\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-weight:700;font-size:14px;color:#fff;\">Mã hóa<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#fb9ca8;margin-top:4px;\">dùng Public key 🔑<\u002Fdiv>\n        <\u002Fdiv>\n        <svg width=\"44\" height=\"20\" viewBox=\"0 0 44 20\"><line x1=\"2\" y1=\"10\" x2=\"34\" y2=\"10\" stroke=\"#4a5488\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\u002Fline><path d=\"M34 5l8 5-8 5z\" fill=\"#4a5488\"><\u002Fpath><\u002Fsvg>\n        <!-- ciphertext -->\n        <div style=\"padding:14px 10px;border-radius:12px;background:rgba(124,140,255,.1);border:1px solid rgba(124,140,255,.3);\">\n          <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"margin-bottom:6px;\"><rect x=\"4\" y=\"5\" width=\"16\" height=\"14\" rx=\"2\" stroke=\"#7c9bff\" stroke-width=\"1.6\"><\u002Frect><path d=\"M7 9h10M7 12h7M7 15h9\" stroke=\"#7c9bff\" stroke-width=\"1.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <div style=\"font-family:'JetBrains Mono';font-size:11.5px;color:#7c9bff;word-break:break-all;line-height:1.4;\">x9F#a7@Qz!2k…<\u002Fdiv>\n          <div style=\"font-size:11px;color:#8b93bf;margin-top:5px;\">Dữ liệu mã hóa<br>truyền qua mạng<\u002Fdiv>\n        <\u002Fdiv>\n        <svg width=\"44\" height=\"20\" viewBox=\"0 0 44 20\"><line x1=\"2\" y1=\"10\" x2=\"34\" y2=\"10\" stroke=\"#4a5488\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\u002Fline><path d=\"M34 5l8 5-8 5z\" fill=\"#4a5488\"><\u002Fpath><\u002Fsvg>\n        <!-- receiver decrypt -->\n        <div>\n          <div style=\"width:58px;height:58px;margin:0 auto 10px;border-radius:50%;background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.4);display:flex;align-items:center;justify-content:center;\">\n            <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\" fill=\"#34d399\"><\u002Frect><path d=\"M8 11V8a4 4 0 017-2.5\" stroke=\"#34d399\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-weight:700;font-size:14px;color:#fff;\">Giải mã<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#7be0bd;margin-top:4px;\">dùng Private key 🗝<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:center;margin-top:22px;padding-top:18px;border-top:1px dashed rgba(255,255,255,.1);font-size:14px;color:#aab2d8;\">\n        <b style=\"color:#fff;\">Private key<\u002Fb> luôn được giữ bí mật trên máy chủ — <b style=\"color:var(--accent,#7c9bff);\">không bao giờ<\u002Fb> truyền ra ngoài.\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== CHỨC NĂNG ===== -->\n<section id=\"chuc-nang\" data-section=\"\" style=\"padding:90px 24px;background:linear-gradient(180deg,#0a0e1f,#0c1226);\">\n  <div style=\"max-width:1000px;margin:0 auto;\">\n    <div style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Sora';font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(120deg,var(--accent,#5b8cff),var(--accent2,#a371ff));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;\">03 · Chức năng<\u002Fdiv>\n    <h2 style=\"font-family:'Sora';font-weight:700;font-size:clamp(28px,4vw,40px);margin:0 0 14px;line-height:1.15;\">4 việc SSL làm cho bạn<\u002Fh2>\n    <p style=\"color:#aab2d8;font-size:17px;line-height:1.7;max-width:640px;margin:0 0 40px;\">Không chỉ là mã hóa — SSL bảo vệ bạn trên cả 4 mặt trận.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;\">\n      <div style=\"padding:26px;border-radius:18px;background:linear-gradient(180deg,#141a36,#10152b);border:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden;\">\n        <div style=\"position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(91,140,255,.25),transparent 70%);\"><\u002Fdiv>\n        <div style=\"width:50px;height:50px;border-radius:13px;background:linear-gradient(135deg,#5b8cff,#7c9bff);display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 10px 24px rgba(91,140,255,.4);\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"9.5\" rx=\"2.4\" fill=\"#fff\"><\u002Frect><path d=\"M7.5 10.5V8a4.5 4.5 0 019 0v2.5\" stroke=\"#fff\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Sora';font-size:18px;margin:0 0 9px;color:#fff;\">Mã hóa dữ liệu<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;color:#aab2d8;line-height:1.65;\">Biến mật khẩu, số thẻ… thành chuỗi vô nghĩa khi truyền đi. Kẻ gian chặn được cũng không đọc nổi.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:26px;border-radius:18px;background:linear-gradient(180deg,#141a36,#10152b);border:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden;\">\n        <div style=\"position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(52,211,153,.25),transparent 70%);\"><\u002Fdiv>\n        <div style=\"width:50px;height:50px;border-radius:13px;background:linear-gradient(135deg,#34d399,#10b981);display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 10px 24px rgba(52,211,153,.4);\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 2l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V5l7-3z\" fill=\"#fff\"><\u002Fpath><path d=\"M9 12l2 2 4-4.5\" stroke=\"#10b981\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Sora';font-size:18px;margin:0 0 9px;color:#fff;\">Xác thực danh tính<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;color:#aab2d8;line-height:1.65;\">Đảm bảo bạn đang vào đúng website thật, không phải trang giả mạo lừa đảo (phishing).<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:26px;border-radius:18px;background:linear-gradient(180deg,#141a36,#10152b);border:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden;\">\n        <div style=\"position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(163,113,255,.25),transparent 70%);\"><\u002Fdiv>\n        <div style=\"width:50px;height:50px;border-radius:13px;background:linear-gradient(135deg,#a371ff,#8b5cf6);display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 10px 24px rgba(163,113,255,.4);\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M7 11c0-3 2-5 5-5s5 2 5 5M9 13v2a3 3 0 006 0v-4M12 11v5\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Sora';font-size:18px;margin:0 0 9px;color:#fff;\">Toàn vẹn dữ liệu<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;color:#aab2d8;line-height:1.65;\">Phát hiện ngay nếu dữ liệu bị sửa, thêm hay xóa trên đường truyền.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:26px;border-radius:18px;background:linear-gradient(180deg,#141a36,#10152b);border:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden;\">\n        <div style=\"position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.25),transparent 70%);\"><\u002Fdiv>\n        <div style=\"width:50px;height:50px;border-radius:13px;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 10px 24px rgba(251,191,36,.4);\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 2l2.5 5 5.5.8-4 3.9.9 5.5L12 20l-4.9 2.2.9-5.5-4-3.9 5.5-.8L12 2z\" fill=\"#fff\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Sora';font-size:18px;margin:0 0 9px;color:#fff;\">Tạo sự tin cậy<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;color:#aab2d8;line-height:1.65;\">Ổ khóa &amp; https giúp khách hàng yên tâm nhập thông tin cá nhân, thanh toán.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== SO SÁNH ===== -->\n<section id=\"so-sanh\" data-section=\"\" style=\"padding:90px 24px;\">\n  <div style=\"max-width:1000px;margin:0 auto;\">\n    <div style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Sora';font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(120deg,var(--accent,#5b8cff),var(--accent2,#a371ff));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;\">04 · So sánh trực quan<\u002Fdiv>\n    <h2 style=\"font-family:'Sora';font-weight:700;font-size:clamp(28px,4vw,40px);margin:0 0 34px;line-height:1.15;\">Website có SSL vs không có SSL<\u002Fh2>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;\">\n      <!-- no ssl -->\n      <div style=\"border-radius:18px;overflow:hidden;border:1px solid rgba(251,113,133,.3);background:linear-gradient(180deg,rgba(251,113,133,.07),#10152b);\">\n        <div style=\"padding:18px 22px;background:rgba(251,113,133,.12);border-bottom:1px solid rgba(251,113,133,.25);display:flex;align-items:center;gap:10px;\">\n          <span style=\"width:30px;height:30px;border-radius:8px;background:#fb7185;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;\">✕<\u002Fspan>\n          <span style=\"font-family:'Sora';font-weight:700;font-size:17px;color:#fff;\">Không có SSL (HTTP)<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:18px 22px;\">\n          <!-- browser bar -->\n          <div style=\"display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:9px;background:#1a2138;border:1px solid rgba(251,113,133,.3);margin-bottom:20px;\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 9v4M12 16v.5M5 19h14L12 5 5 19z\" stroke=\"#fb7185\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-family:'JetBrains Mono';font-size:13px;color:#fb9ca8;\">⚠ Không bảo mật <span style=\"color:#6b7299;\">| http://shop.vn<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{noSslPoints}}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:11px;align-items:flex-start;margin-bottom:13px;font-size:14.5px;color:#c2c8ec;line-height:1.55;\">\n              <span style=\"flex:none;color:#fb7185;font-weight:800;margin-top:1px;\">✕<\u002Fspan>{{p}}\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- with ssl -->\n      <div style=\"border-radius:18px;overflow:hidden;border:1px solid rgba(52,211,153,.35);background:linear-gradient(180deg,rgba(52,211,153,.07),#10152b);\">\n        <div style=\"padding:18px 22px;background:rgba(52,211,153,.12);border-bottom:1px solid rgba(52,211,153,.25);display:flex;align-items:center;gap:10px;\">\n          <span style=\"width:30px;height:30px;border-radius:8px;background:#34d399;display:flex;align-items:center;justify-content:center;font-weight:800;color:#06251a;\">✓<\u002Fspan>\n          <span style=\"font-family:'Sora';font-weight:700;font-size:17px;color:#fff;\">Có SSL (HTTPS)<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:18px 22px;\">\n          <div style=\"display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:9px;background:#1a2138;border:1px solid rgba(52,211,153,.3);margin-bottom:20px;\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"9.5\" rx=\"2.4\" fill=\"#34d399\"><\u002Frect><path d=\"M7.5 10.5V8a4.5 4.5 0 019 0v2.5\" stroke=\"#34d399\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-family:'JetBrains Mono';font-size:13px;color:#7be0bd;\">🔒 <span style=\"color:#6b7299;\">https://<\u002Fspan>shop.vn<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{sslPoints}}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:11px;align-items:flex-start;margin-bottom:13px;font-size:14.5px;color:#c2c8ec;line-height:1.55;\">\n              <span style=\"flex:none;color:#34d399;font-weight:800;margin-top:1px;\">✓<\u002Fspan>{{p}}\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== HOẠT ĐỘNG ===== -->\n<section id=\"hoat-dong\" data-section=\"\" style=\"padding:90px 24px;background:linear-gradient(180deg,#0c1226,#0a0e1f);\">\n  <div style=\"max-width:1000px;margin:0 auto;\">\n    <div style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Sora';font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(120deg,var(--accent,#5b8cff),var(--accent2,#a371ff));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;\">05 · Cách hoạt động<\u002Fdiv>\n    <h2 style=\"font-family:'Sora';font-weight:700;font-size:clamp(28px,4vw,40px);margin:0 0 14px;line-height:1.15;\">Cái \"bắt tay\" SSL diễn ra trong tích tắc<\u002Fh2>\n    <p style=\"color:#aab2d8;font-size:17px;line-height:1.7;max-width:680px;margin:0 0 40px;\">Mỗi lần bạn mở một trang HTTPS, trình duyệt và máy chủ thực hiện 5 bước sau — tất cả chỉ trong vài mili-giây:<\u002Fp>\n\n    <!-- header row browser <-> server -->\n    <div style=\"display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:0 auto 8px;\">\n      <div style=\"text-align:center;\">\n        <div style=\"width:56px;height:56px;border-radius:15px;background:rgba(91,140,255,.14);border:1px solid rgba(91,140,255,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;\">\n          <svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"13\" rx=\"2\" stroke=\"#7c9bff\" stroke-width=\"1.8\"><\u002Frect><path d=\"M8 21h8M12 17v4\" stroke=\"#7c9bff\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:600;color:#d4d9f5;\">Trình duyệt<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(124,140,255,.4),transparent);margin:0 16px;margin-bottom:24px;\"><\u002Fdiv>\n      <div style=\"text-align:center;\">\n        <div style=\"width:56px;height:56px;border-radius:15px;background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;\">\n          <svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"4\" y=\"3\" width=\"16\" height=\"7\" rx=\"1.6\" stroke=\"#34d399\" stroke-width=\"1.8\"><\u002Frect><rect x=\"4\" y=\"14\" width=\"16\" height=\"7\" rx=\"1.6\" stroke=\"#34d399\" stroke-width=\"1.8\"><\u002Frect><circle cx=\"8\" cy=\"6.5\" r=\"1\" fill=\"#34d399\"><\u002Fcircle><circle cx=\"8\" cy=\"17.5\" r=\"1\" fill=\"#34d399\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:600;color:#d4d9f5;\">Máy chủ web<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- steps -->\n    <div style=\"display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto;\">\n      <sc-for list=\"{{handshake}}\" as=\"s\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex;gap:18px;align-items:flex-start;padding:22px 24px;border-radius:16px;background:linear-gradient(180deg,#141a36,#10152b);border:1px solid rgba(255,255,255,.07);\">\n          <span style=\"flex:none;width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent,#5b8cff),var(--accent2,#a371ff));display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:800;font-size:19px;color:#fff;box-shadow:0 8px 20px rgba(91,140,255,.35);\">{{s.num}}<\u002Fspan>\n          <div>\n            <div style=\"font-weight:600;font-size:16px;color:#fff;margin-bottom:5px;\">{{s.title}}<\u002Fdiv>\n            <p style=\"margin:0;font-size:14.5px;color:#aab2d8;line-height:1.6;\">{{s.text}}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== CA ===== -->\n<section id=\"ca\" data-section=\"\" style=\"padding:90px 24px;\">\n  <div style=\"max-width:1000px;margin:0 auto;\">\n    <div style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Sora';font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(120deg,var(--accent,#5b8cff),var(--accent2,#a371ff));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;\">06 · Certificate Authority<\u002Fdiv>\n    <h2 style=\"font-family:'Sora';font-weight:700;font-size:clamp(28px,4vw,40px);margin:0 0 18px;line-height:1.15;\">Ai cấp chứng chỉ? Vai trò của CA<\u002Fh2>\n\n    <div style=\"display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;margin-bottom:44px;\">\n      <div>\n        <p style=\"color:#c2c8ec;font-size:17px;line-height:1.75;margin:0 0 16px;\">Mỗi chứng chỉ chỉ cấp cho <b style=\"color:#fff;\">1 tên miền duy nhất<\u002Fb>, và chỉ những <b style=\"color:var(--accent,#7c9bff);\">tổ chức uy tín (CA)<\u002Fb> mới đủ thẩm quyền cấp &amp; quản lý.<\u002Fp>\n        <p style=\"color:#aab2d8;font-size:16px;line-height:1.75;margin:0;\">Trình duyệt (Chrome, Firefox…) tích hợp sẵn danh sách CA tin cậy, nên khi nhận chứng chỉ, nó <b style=\"color:#34d399;\">đối chiếu ngay<\u002Fb> để biết thông tin có chính xác hay không.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:26px;border-radius:18px;background:linear-gradient(135deg,rgba(91,140,255,.12),rgba(163,113,255,.12));border:1px solid rgba(124,140,255,.25);text-align:center;\">\n        <div style=\"font-size:40px;margin-bottom:8px;\">🏛️<\u002Fdiv>\n        <div style=\"font-family:'Sora';font-weight:600;font-size:15px;color:#fff;line-height:1.5;\">CA = \"Cơ quan công an\"<br>cấp căn cước cho website<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-family:'Sora';font-size:19px;margin:0 0 22px;color:#fff;\">Một số CA uy tín phổ biến<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;\">\n      <sc-for list=\"{{cas}}\" as=\"ca\" hint-placeholder-count=\"6\">\n        <div style=\"padding:20px 22px;border-radius:15px;background:linear-gradient(180deg,#141a36,#10152b);border:1px solid {{ca.border}};\">\n          <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:9px;\">\n            <span style=\"width:34px;height:34px;border-radius:9px;background:{{ca.badge}};display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:800;color:#fff;font-size:15px;\">{{ca.initial}}<\u002Fspan>\n            <span style=\"font-family:'Sora';font-weight:700;font-size:16px;color:#fff;\">{{ca.name}}<\u002Fspan>\n            <span style=\"{{ca.tagStyle}}\">{{ca.tag}}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:14px;color:#aab2d8;line-height:1.55;\">{{ca.desc}}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== CÁC LOẠI ===== -->\n<section id=\"cac-loai\" data-section=\"\" style=\"padding:90px 24px;background:linear-gradient(180deg,#0a0e1f,#0c1226);\">\n  <div style=\"max-width:1000px;margin:0 auto;\">\n    <div style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Sora';font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(120deg,var(--accent,#5b8cff),var(--accent2,#a371ff));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;\">07 · Phân loại<\u002Fdiv>\n    <h2 style=\"font-family:'Sora';font-weight:700;font-size:clamp(28px,4vw,40px);margin:0 0 14px;line-height:1.15;\">Các loại chứng chỉ SSL<\u002Fh2>\n    <p style=\"color:#aab2d8;font-size:17px;line-height:1.7;max-width:680px;margin:0 0 36px;\">Chia theo <b style=\"color:#fff;\">mức độ xác thực<\u002Fb> (DV → OV → EV) và theo <b style=\"color:#fff;\">phạm vi bảo vệ<\u002Fb> (Wildcard, Multi-Domain).<\u002Fp>\n\n    <!-- trust ladder -->\n    <div style=\"font-family:'Sora';font-size:14px;color:#7a83ad;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;\">Theo mức độ xác thực — độ tin cậy tăng dần ▲<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-bottom:40px;\">\n      <div style=\"padding:26px;border-radius:18px;background:linear-gradient(180deg,#141a36,#10152b);border:1px solid rgba(91,140,255,.2);\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;\">\n          <span style=\"font-family:'JetBrains Mono';font-weight:700;font-size:20px;color:#7c9bff;\">DV<\u002Fspan>\n          <div style=\"display:flex;gap:4px;\"><span style=\"width:9px;height:18px;border-radius:3px;background:#5b8cff;\"><\u002Fspan><span style=\"width:9px;height:18px;border-radius:3px;background:#2a3260;\"><\u002Fspan><span style=\"width:9px;height:18px;border-radius:3px;background:#2a3260;\"><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Sora';font-size:16px;margin:0 0 8px;color:#fff;\">Domain Validation<\u002Fh3>\n        <p style=\"margin:0 0 14px;font-size:14px;color:#aab2d8;line-height:1.6;\">Chỉ xác thực quyền sở hữu tên miền. Cấp nhanh, đơn giản, thường miễn phí.<\u002Fp>\n        <div style=\"font-size:12.5px;color:#7be0bd;padding:7px 11px;border-radius:8px;background:rgba(52,211,153,.1);display:inline-block;\">👤 Blog, web cá nhân<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:26px;border-radius:18px;background:linear-gradient(180deg,#161d3e,#10152b);border:1px solid rgba(163,113,255,.3);\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;\">\n          <span style=\"font-family:'JetBrains Mono';font-weight:700;font-size:20px;color:#a371ff;\">OV<\u002Fspan>\n          <div style=\"display:flex;gap:4px;\"><span style=\"width:9px;height:18px;border-radius:3px;background:#a371ff;\"><\u002Fspan><span style=\"width:9px;height:18px;border-radius:3px;background:#a371ff;\"><\u002Fspan><span style=\"width:9px;height:18px;border-radius:3px;background:#2a3260;\"><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Sora';font-size:16px;margin:0 0 8px;color:#fff;\">Organization Validation<\u002Fh3>\n        <p style=\"margin:0 0 14px;font-size:14px;color:#aab2d8;line-height:1.6;\">Xác thực cả tên miền lẫn tổ chức sở hữu. CA kiểm tra thông tin doanh nghiệp trước khi cấp.<\u002Fp>\n        <div style=\"font-size:12.5px;color:#c4a9ff;padding:7px 11px;border-radius:8px;background:rgba(163,113,255,.12);display:inline-block;\">🏢 Doanh nghiệp<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:26px;border-radius:18px;background:linear-gradient(180deg,#1a2148,#10152b);border:1px solid rgba(251,191,36,.35);position:relative;\">\n        <span style=\"position:absolute;top:-10px;right:16px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3a2800;\">Cao nhất<\u002Fspan>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;\">\n          <span style=\"font-family:'JetBrains Mono';font-weight:700;font-size:20px;color:#fbbf24;\">EV<\u002Fspan>\n          <div style=\"display:flex;gap:4px;\"><span style=\"width:9px;height:18px;border-radius:3px;background:#fbbf24;\"><\u002Fspan><span style=\"width:9px;height:18px;border-radius:3px;background:#fbbf24;\"><\u002Fspan><span style=\"width:9px;height:18px;border-radius:3px;background:#fbbf24;\"><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Sora';font-size:16px;margin:0 0 8px;color:#fff;\">Extended Validation<\u002Fh3>\n        <p style=\"margin:0 0 14px;font-size:14px;color:#aab2d8;line-height:1.6;\">Xác thực đầy đủ, nghiêm ngặt nhất. Hiển thị cả tên tổ chức trên thanh địa chỉ.<\u002Fp>\n        <div style=\"font-size:12.5px;color:#fcd34d;padding:7px 11px;border-radius:8px;background:rgba(251,191,36,.12);display:inline-block;\">🏦 Ngân hàng, tài chính<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- coverage -->\n    <div style=\"font-family:'Sora';font-size:14px;color:#7a83ad;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;\">Theo phạm vi bảo vệ<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;\">\n      <div style=\"padding:26px;border-radius:18px;background:linear-gradient(180deg,#141a36,#10152b);border:1px solid rgba(255,255,255,.08);\">\n        <h3 style=\"font-family:'Sora';font-size:17px;margin:0 0 10px;color:#fff;\">🌐 Wildcard SSL<\u002Fh3>\n        <p style=\"margin:0 0 12px;font-size:14.5px;color:#aab2d8;line-height:1.6;\">Bảo vệ 1 tên miền chính + <b style=\"color:#fff;\">tất cả subdomain<\u002Fb> của nó.<\u002Fp>\n        <div style=\"font-family:'JetBrains Mono';font-size:13px;color:#7c9bff;padding:10px 13px;border-radius:9px;background:#0e1326;border:1px solid rgba(124,140,255,.2);\">*.example.com<br><span style=\"color:#6b7299;\">→ mail.example.com, blog.example.com…<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:26px;border-radius:18px;background:linear-gradient(180deg,#141a36,#10152b);border:1px solid rgba(255,255,255,.08);\">\n        <h3 style=\"font-family:'Sora';font-size:17px;margin:0 0 10px;color:#fff;\">🗂 Multi-Domain (SAN)<\u002Fh3>\n        <p style=\"margin:0 0 12px;font-size:14.5px;color:#aab2d8;line-height:1.6;\">Bảo vệ <b style=\"color:#fff;\">nhiều tên miền khác nhau<\u002Fb> trong cùng 1 chứng chỉ.<\u002Fp>\n        <div style=\"font-family:'JetBrains Mono';font-size:13px;color:#34d399;padding:10px 13px;border-radius:9px;background:#0e1326;border:1px solid rgba(52,211,153,.2);\">example.com<br>example.org<br>example.net<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== TRIỂN KHAI ===== -->\n<section id=\"trien-khai\" data-section=\"\" style=\"padding:90px 24px;\">\n  <div style=\"max-width:1000px;margin:0 auto;\">\n    <div style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Sora';font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(120deg,var(--accent,#5b8cff),var(--accent2,#a371ff));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;\">08 · Quy trình<\u002Fdiv>\n    <h2 style=\"font-family:'Sora';font-weight:700;font-size:clamp(28px,4vw,40px);margin:0 0 40px;line-height:1.15;\">6 bước để website có SSL<\u002Fh2>\n\n    <div style=\"position:relative;\">\n      <sc-for list=\"{{deploy}}\" as=\"d\" hint-placeholder-count=\"6\">\n        <div style=\"display:flex;gap:22px;align-items:flex-start;padding-bottom:28px;position:relative;\">\n          <div style=\"flex:none;display:flex;flex-direction:column;align-items:center;\">\n            <span style=\"width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent,#5b8cff),var(--accent2,#a371ff));display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:800;font-size:18px;color:#fff;box-shadow:0 8px 20px rgba(91,140,255,.35);z-index:2;\">{{d.num}}<\u002Fspan>\n            <span style=\"width:2px;flex:1;background:linear-gradient(180deg,rgba(124,140,255,.4),rgba(124,140,255,.05));margin-top:6px;min-height:18px;\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:20px 24px;border-radius:15px;background:linear-gradient(180deg,#141a36,#10152b);border:1px solid rgba(255,255,255,.07);flex:1;margin-top:-2px;\">\n            <div style=\"font-family:'Sora';font-weight:600;font-size:16.5px;color:#fff;margin-bottom:6px;\">{{d.title}}<\u002Fdiv>\n            <p style=\"margin:0;font-size:14.5px;color:#aab2d8;line-height:1.6;\">{{d.text}}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== THỰC HÀNH ===== -->\n<sc-if value=\"{{showPractice}}\" hint-placeholder-val=\"{{true}}\">\n<section id=\"thuc-hanh\" data-section=\"\" style=\"padding:90px 24px;background:linear-gradient(180deg,#0c1226,#0a0e1f);\">\n  <div style=\"max-width:1000px;margin:0 auto;\">\n    <div style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Sora';font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(120deg,#34d399,#5b8cff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;\">▶ Thực hành<\u002Fdiv>\n    <h2 style=\"font-family:'Sora';font-weight:700;font-size:clamp(28px,4vw,40px);margin:0 0 14px;line-height:1.15;\">Tự cài SSL miễn phí với Let's Encrypt<\u002Fh2>\n    <p style=\"color:#aab2d8;font-size:17px;line-height:1.7;max-width:720px;margin:0 0 30px;\">Mục tiêu: xin chứng chỉ SSL <b style=\"color:#34d399;\">miễn phí<\u002Fb> cho domain và cài lên <b style=\"color:#fff;\">Server Ubuntu + Nginx<\u002Fb> bằng công cụ <b style=\"color:var(--accent,#7c9bff);\">Certbot<\u002Fb>.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1.4fr;gap:24px;align-items:start;\">\n      <div style=\"display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"padding:20px;border-radius:15px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25);\">\n          <div style=\"font-size:13px;color:#7be0bd;font-weight:600;margin-bottom:6px;\">CHUẨN BỊ<\u002Fdiv>\n          <ul style=\"margin:0;padding-left:18px;font-size:14.5px;color:#c2c8ec;line-height:1.8;\">\n            <li>1 domain đã trỏ về IP server<\u002Fli>\n            <li>Server Ubuntu có quyền sudo<\u002Fli>\n            <li>Nginx đã chạy<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"padding:20px;border-radius:15px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.22);\">\n          <div style=\"font-size:13px;color:#fcd34d;font-weight:600;margin-bottom:6px;\">💡 GHI NHỚ<\u002Fdiv>\n          <p style=\"margin:0;font-size:14px;color:#c2c8ec;line-height:1.6;\">Chứng chỉ Let's Encrypt có hạn <b style=\"color:#fff;\">90 ngày<\u002Fb> — nhưng Certbot tự động gia hạn giúp bạn.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- terminal -->\n      <div style=\"border-radius:16px;overflow:hidden;background:#0b0f1d;border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 50px rgba(0,0,0,.5);\">\n        <div style=\"display:flex;align-items:center;gap:7px;padding:12px 16px;background:#161b30;border-bottom:1px solid rgba(255,255,255,.06);\">\n          <span style=\"width:11px;height:11px;border-radius:50%;background:#ff5f57;\"><\u002Fspan>\n          <span style=\"width:11px;height:11px;border-radius:50%;background:#febc2e;\"><\u002Fspan>\n          <span style=\"width:11px;height:11px;border-radius:50%;background:#28c840;\"><\u002Fspan>\n          <span style=\"margin-left:8px;font-family:'JetBrains Mono';font-size:12px;color:#6b7299;\">ubuntu@server: ~<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:20px;font-family:'JetBrains Mono';font-size:13.5px;line-height:1.95;color:#c2c8ec;overflow-x:auto;\">\n          <div style=\"color:#5a6488;\"># 1. Cài đặt Certbot cho Nginx<\u002Fdiv>\n          <div><span style=\"color:#34d399;\">$<\u002Fspan> sudo apt update<\u002Fdiv>\n          <div><span style=\"color:#34d399;\">$<\u002Fspan> sudo apt install certbot python3-certbot-nginx<\u002Fdiv>\n          <div style=\"height:14px;\"><\u002Fdiv>\n          <div style=\"color:#5a6488;\"># 2. Xin &amp; tự động cài chứng chỉ<\u002Fdiv>\n          <div><span style=\"color:#34d399;\">$<\u002Fspan> sudo certbot --nginx \\<\u002Fdiv>\n          <div style=\"padding-left:20px;color:#7c9bff;\">-d example.com -d www.example.com<\u002Fdiv>\n          <div style=\"height:14px;\"><\u002Fdiv>\n          <div style=\"color:#5a6488;\"># 3. Kiểm tra tự động gia hạn<\u002Fdiv>\n          <div><span style=\"color:#34d399;\">$<\u002Fspan> sudo certbot renew --dry-run<\u002Fdiv>\n          <div style=\"height:10px;\"><\u002Fdiv>\n          <div style=\"color:#34d399;\">✓ Congratulations! HTTPS đã sẵn sàng <span style=\"display:inline-block;width:8px;height:15px;background:#34d399;vertical-align:-2px;animation:blink 1s step-end infinite;\"><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ===== TÓM TẮT ===== -->\n<section id=\"tom-tat\" data-section=\"\" style=\"padding:90px 24px;\">\n  <div style=\"max-width:1000px;margin:0 auto;\">\n    <div style=\"padding:46px 40px;border-radius:24px;background:linear-gradient(135deg,rgba(91,140,255,.14),rgba(163,113,255,.14));border:1px solid rgba(124,140,255,.25);position:relative;overflow:hidden;\">\n      <div style=\"position:absolute;top:-60px;right:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(163,113,255,.3),transparent 70%);\"><\u002Fdiv>\n      <div style=\"position:relative;\">\n        <h2 style=\"font-family:'Sora';font-weight:700;font-size:clamp(26px,4vw,36px);margin:0 0 24px;\">Tóm tắt 30 giây ⚡<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;\">\n          <sc-for list=\"{{summary}}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:12px;align-items:flex-start;\">\n              <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"flex:none;margin-top:2px;\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"rgba(124,140,255,.25)\"><\u002Fcircle><path d=\"M8 12l3 3 5-6\" stroke=\"#a9b6ff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <p style=\"margin:0;font-size:15px;line-height:1.55;color:#d4d9f5;\">{{s}}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== FOOTER ===== -->\n<footer style=\"padding:50px 24px 60px;text-align:center;border-top:1px solid rgba(255,255,255,.07);background:#080b16;\">\n  <div style=\"display:inline-flex;align-items:center;gap:10px;margin-bottom:16px;\">\n    <span style=\"width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent,#5b8cff),var(--accent2,#a371ff));display:flex;align-items:center;justify-content:center;\">\n      <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 2l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V5l7-3z\" fill=\"#fff\"><\u002Fpath><\u002Fsvg>\n    <\u002Fspan>\n    <span style=\"font-family:'Sora';font-weight:700;font-size:17px;\">Certificate SSL — Bài 31<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"color:#7a83ad;font-size:14px;margin:0 0 6px;\">Tài liệu học tập về bảo mật web · Biên soạn &amp; thiết kế bởi <b style=\"color:#c7cdf0;\">Yên Nguyễn<\u002Fb><\u002Fp>\n  <p style=\"color:#4f567a;font-size:12.5px;margin:0;\">© Yên Nguyễn — All Rights Reserved<\u002Fp>\n<\u002Ffooter>\n\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:820},&quot;accentTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Xanh dương → Tím&quot;,&quot;options&quot;:[&quot;Xanh dương → Tím&quot;,&quot;Teal → Lục&quot;,&quot;Hồng → Cam&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;showPractice&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { activeId: 'hero', progress: 0, secure: false };\n\n  componentDidMount() {\n    this._onScroll = () => {\n      const max = document.documentElement.scrollHeight - window.innerHeight;\n      const p = max > 0 ? Math.min(100, (window.scrollY / max) * 100) : 0;\n      this.setState({ progress: p });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n    this._io = new IntersectionObserver((entries) => {\n      entries.forEach(e => { if (e.isIntersecting) this.setState({ activeId: e.target.id }); });\n    }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });\n    document.querySelectorAll('[data-section]').forEach(s => this._io.observe(s));\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    if (this._io) this._io.disconnect();\n  }\n\n  renderVals() {\n    const A = this.props.accentTheme || 'Xanh dương → Tím';\n    const themes = {\n      'Xanh dương → Tím': ['#5b8cff', '#a371ff'],\n      'Teal → Lục': ['#2dd4bf', '#34d399'],\n      'Hồng → Cam': ['#fb7185', '#fb923c'],\n    };\n    const [accentA, accentB] = themes[A] || themes['Xanh dương → Tím'];\n\n    const tocBase = [\n      { id: 'muc-tieu', label: 'Mục tiêu' },\n      { id: 'khai-niem', label: 'Khái niệm' },\n      { id: 'mo-phong', label: 'Mô phỏng' },\n      { id: 'ben-trong', label: 'Cấu trúc' },\n      { id: 'chuc-nang', label: 'Chức năng' },\n      { id: 'so-sanh', label: 'So sánh' },\n      { id: 'hoat-dong', label: 'Hoạt động' },\n      { id: 'ca', label: 'CA' },\n      { id: 'cac-loai', label: 'Các loại' },\n      { id: 'trien-khai', label: 'Triển khai' },\n      { id: 'thuc-hanh', label: 'Thực hành' },\n    ];\n    const toc = tocBase.map(t => {\n      const active = t.id === this.state.activeId;\n      const chipStyle = `padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;text-decoration:none;font-family:'Be Vietnam Pro';transition:all .2s;` +\n        (active\n          ? `color:#fff;background:linear-gradient(135deg,${accentA},${accentB});box-shadow:0 4px 12px rgba(91,140,255,.35);`\n          : `color:#99a0c8;background:rgba(255,255,255,.04);`);\n      return { id: t.id, label: t.label, chipStyle };\n    });\n\n    const objectives = [\n      { num: 1, text: 'Hiểu SSL/TLS là gì và vì sao mọi website đều cần nó.' },\n      { num: 2, text: 'Nắm được cấu trúc & nội dung của một chứng chỉ SSL.' },\n      { num: 3, text: 'Hiểu cơ chế mã hóa bằng Public key / Private key.' },\n      { num: 4, text: 'Biết quy trình \"bắt tay\" giữa trình duyệt và máy chủ.' },\n      { num: 5, text: 'Phân biệt các loại: DV, OV, EV, Wildcard, Multi-Domain.' },\n      { num: 6, text: 'Tự xin & cài chứng chỉ SSL miễn phí với Let\\u2019s Encrypt.' },\n    ];\n\n    const certFields = [\n      'Tên miền (domain) được cấp phép',\n      'Người / tổ chức / thiết bị sở hữu',\n      'Cơ quan cấp chứng chỉ (CA)',\n      'Chữ ký số của CA',\n      'Ngày cấp & ngày hết hạn',\n      'Public key — dùng để mã hóa dữ liệu',\n      'Tên miền phụ (subdomain) liên kết',\n    ];\n\n    const noSslPoints = [\n      'Dữ liệu truyền dạng văn bản thô — ai cũng đọc được.',\n      'Trình duyệt cảnh báo \"Không bảo mật\" (Not secure).',\n      'Dễ bị giả mạo, đánh cắp mật khẩu & thẻ.',\n      'Google xếp hạng SEO thấp hơn.',\n    ];\n    const sslPoints = [\n      'D
